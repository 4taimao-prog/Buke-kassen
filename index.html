function startParade(cv,armies){
  const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||340,h=200;cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const fc=flagC(),groups=armies.length?armies:[{name:'本隊',n:30,kinds:{spear:10,sword:10,archer:10}}];
  // build the procession: the house banner and lord's escort, then each army behind its own banner
  const ITEMS=[];let x=0;
  ITEMS.push({t:'house',x});x+=70;
  for(const a of groups){ITEMS.push({t:'banner',x,a});x+=26;
    const n=clamp(Math.round(a.n/15),4,30),kinds=Object.keys(a.kinds).filter(k=>SPR[k]);const tot=kinds.reduce((s,k)=>s+a.kinds[k],0)||1;
    let list=[];for(const k of kinds)for(let i=0;i<Math.round(n*a.kinds[k]/tot);i++)list.push(k);if(!list.length)list=['spear'];
    const cols=Math.ceil(list.length/3);list.forEach((k,i)=>ITEMS.push({t:'man',k,x:x+(i/3|0)*20,row:i%3,ph:Math.random()*2}));x+=cols*20+44;}
  const total=x+60,t0=performance.now()-((w*.45)/28)*1000;
  const frame=now=>{if(ovMode!=='finale'||!cv.isConnected)return;const t=(now-t0)/1000,off=(t*28)%(total+w)-total;
    const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#f3dfa4');sky.addColorStop(.6,'#e9cf8a');sky.addColorStop(1,'#cdb06a');g.fillStyle=sky;g.fillRect(0,0,w,h);
    g.fillStyle='rgba(120,100,70,.25)';g.beginPath();g.moveTo(0,110);for(let i=0;i<=w;i+=30)g.lineTo(i,95-18*Math.sin(i*.02+1)-10*Math.sin(i*.07));g.lineTo(w,130);g.lineTo(0,130);g.fill();
    g.fillStyle='#8a9a5a';g.fillRect(0,120,w,h-120);g.fillStyle='#b9a272';g.fillRect(0,140,w,34);g.fillStyle='rgba(0,0,0,.08)';g.fillRect(0,172,w,2);
    // gold haze bands like a scroll painting
    g.fillStyle='rgba(240,214,140,.75)';for(const[y,s]of[[20,.0],[60,.4]]){const bx=((t*6+s*400)%(w+200))-150;g.beginPath();g.ellipse(bx+80,y,90,9,0,0,Math.PI*2);g.ellipse(bx+220,y+6,70,8,0,0,Math.PI*2);g.fill();}
    for(const it of ITEMS){const px=total-it.x+off;if(px<-60||px>w+60)continue;// the house banner leads, entering first
      if(it.t==='house'){// house banner with your crest, carried on a pole
        g.strokeStyle='#3a2a1a';g.lineWidth=2;g.beginPath();g.moveTo(px,170);g.lineTo(px,58);g.stroke();
        g.fillStyle=fc.c;g.fillRect(px+1,60,22,64);g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1;g.strokeRect(px+1,60,22,64);
        g.save();drawMon(g,myMon(),px+12,76,9,fc.mon,null,null);g.restore();
        g.fillStyle=fc.mon;g.font='800 11px "Shippori Mincho B1",serif';g.textAlign='center';const hn=EN()?ieName():ieName()+'家';
        if(EN())g.fillText(hn.slice(0,6),px+12,112);else[...hn].slice(0,3).forEach((ch,i)=>g.fillText(ch,px+12,96+i*12));
        const At=SPR.aka&&SPR.aka[0];if(At){const cw=At.cw/2,ch=At.ch/2,f=1+((t*5)|0)%2;g.drawImage(At.H,f*cw,0,cw,ch,px+18,96,cw*.5,ch*.5);}
        continue;}
      if(it.t==='banner'){const a=it.a;g.strokeStyle='#3a2a1a';g.lineWidth=1.6;g.beginPath();g.moveTo(px,170);g.lineTo(px,74);g.stroke();
        g.fillStyle='#f4ecd8';g.fillRect(px+1,76,16,60);g.fillStyle=fc.c;g.fillRect(px+1,76,16,4);g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=.8;g.strokeRect(px+1,76,16,60);
        g.fillStyle='#1c1814';g.textAlign='center';const nmT=a.name==='本隊'?TT('本隊','Main'):armyLabel(a.name);
        if(EN()){g.save();g.translate(px+9,106);g.rotate(Math.PI/2);g.font='700 9px "Zen Kaku Gothic New",sans-serif';g.fillText(nmT.slice(0,12),0,3);g.restore();}
        else{g.font='800 11px "Shippori Mincho B1",serif';[...nmT].slice(0,4).forEach((c,i)=>g.fillText(c,px+9,90+i*12));}
        g.font='700 10px "Zen Kaku Gothic New",sans-serif';g.fillStyle='#3a2a14';g.fillText(a.n+TT('人',''),px+9,186);continue;}
      const At=SPR[it.k]&&SPR[it.k][0];if(!At)continue;const cw=At.cw/2,ch=At.ch/2,f=1+(((t*4)+it.ph)|0)%2,y=118+it.row*12;
      g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(px+12,y+50*.62,7,2,0,0,Math.PI*2);g.fill();
      g.drawImage(At.H,f*cw,0,cw,ch,px,y-6,cw*.56,ch*.56);}
    requestAnimationFrame(frame);};
  requestAnimationFrame(frame);
}

      <li>The enemy builds fences, towers and a <b>garrison</b> around its HQ that sallies out when you come close. Its attacks start a while after the battle begins</li>
      <li>Tap your camp (the band at the bottom) to place troops and buildings; drag to place several. Troops don't move until ordered</li>
      <li><b>Moving troops</b>: "Command" → <b>circle</b> them with your finger or tap a squad flag → <b>tap</b> the destination. While commanding, tap a unit button to select only that type</li>
      <li>Turn your phone <b>sideways</b> for a landscape view (your camp left, enemy right). The top-right button goes fullscreen</li>
      <li>Use your browser's share menu to <b>Add to Home Screen</b>: it opens fullscreen like an app and works offline after the first visit</li>
      <li>Pan and zoom the field with two fingers. Tap the minimap to jump. "Pan" lets you move with one finger</li>
      <li><b>In Conquest you only see enemies near your own troops</b>. Send riders ahead to scout</li>
      <li><b>Rivers</b> can only be crossed at bridges and fords. <b>Crags</b> and <b>ponds</b> block the way. <b>Forests</b> are slow but stop arrows. <b>Roads</b> are fast</li>
      <li><b>Moats</b> can be dug in your camp (12 MP), or outside it next to your fences, walls, towers or 2+ soldiers for double cost (24 MP). Movement in a moat is 1/5 speed. Enemy <b>sappers</b> slowly fill moats in. <b>Pit traps</b> hold enemies for a while (7 fill one up)</li>
      <li><b>Upgrade</b>: fence → <b>stone wall</b> (60) → <b>tamon wall</b> (150); tower → <b>keep</b> (300) → <b>great keep</b> (600). Neighbouring stone walls join into a castle wall. Keeps shoot hard and raise MP</li>
      <li><b>Shrines</b> (250 MP, up to 3 in your camp): each gives your troops +5% attack and -5% damage taken. The enemy builds them too in later battles</li>
      <li>Build a <b>Dock</b> (80 MP) on a shore to launch <b>warships</b> (100 MP). Ships sail only on water and shoot the shore (only arrows can hit them). Select troops and tap a ship to board (warship 20, sekibune 40, atakebune 80; ships and the troops aboard don't count toward the 1000 limit, up to 500 at sea); select the ship and tap land to sail to the shore and land them anywhere but cliffs. Upgrade beside a dock: <b>Sekibune</b> (150) → <b>Atakebune</b> (300). Upgrading a dock makes a <b>Shipyard</b> (400): beside it an atakebune becomes an ironclad <b>Tekkosen</b> (600, carries 300), and up to 1000 troops can sail. Select a ship and tap it to land its troops right there. In Conquest ships unlock in Hokuriku, horse archers in the second region, Akazonae in San-yo</li>
      <li>Any soldier holding position <b>right behind your fence or wall</b> — even swords, spears and riders — shoots arrows at enemies approaching the wall (a little weaker than archers)</li>
      <li><b>Fences in the enemy camp</b>: with 10+ of your soldiers on the spot, outnumbering nearby enemies at least 2 to 1, you can put up fences even inside the enemy camp</li>
      <li><b>Sappers</b> tear down fences, walls and towers quickly but are weak against soldiers</li>
      <li><b>Akazonae</b> are crimson-armoured riders: strong at all times, and <b>charging downhill</b> puts them in charge mode for a while (1.25× speed, 2.4× attack). <b>Horse archers</b> unlock at battle 2. Your <b>crest</b> appears on their banners</li>
      <li>Your troops wear black armour; the enemy wears blue</li>
      <li>Matchups: spear beats horse, horse beats bow, bow beats sword, sword beats spear. Attacking <b>downhill</b> is up to 1.8× stronger, uphill weaker, and bows reach further from high ground. If you have troops on <b>both sides</b> of an enemy squad, even a little apart, it is a <b>pincer</b> (1.6× attack, bows included) and the squad is marked "Pincer". Squads right <b>behind your own fences or walls</b> can't be pincered</li>
      <li>Hold the area around a <b>fort</b> with only your troops to capture it (+3 MP/s). Take the enemy HQ to win</li>
`:`      <li><b>局地戦</b>は1画面の小さな合戦。<b>地方戦</b>は川と山のある戦場。<b>全国戦</b>は広大な戦場で、霧と砦がある。進み具合はそれぞれ別</li>
      <li><b>家名と官位</b>：最初に家名と名前を決める（タイトルの名札からいつでも変更できる）。全国戦で国を攻め取るごとに官位が上がり（清盛の歩みが目安）、同じ位の官職や、攻め取った国の国守から名乗りを選べる。本陣には当主が座り、位が上がるほど具足と陣が豪華になる。記録はこの端末に保存される</li>
      <li><b>全国戦</b>は関東の伊豆国から始まり、地図は各地方のおおまかな形（海・半島・湾）になっている。地方の後半の国では<b>敵の本陣が2つ</b>あり、両方落とすと勝ち。国を一つずつ攻め取って天下統一をめざす。5つの国で1地方。同じ地方の間は地形が変わらず、勝つたびに次の敵はさらに奥に陣を構える。<b>石垣・天守以上の城</b>と、そのそばの兵（古い軍を優先して全部で最大1000人、1つの軍は500人まで。新しくできた軍は1000人を超えても最低200人）・堀は次の陣に残る。引き継いだ兵は「伊豆国軍」のように国の名の軍になり、兵数の上限1000人とは別枠で、少し薄い色で描かれる。地方を平定すると、その地方の城は絵巻に残り、タイトルの「平定した地方」から城がそのままの最終決戦をいつでもやり直せる。城のそばの兵は「関東軍」のように地方の名の軍として次の地方へ連れて行け、天守と砦のMP増加の1/3が次の地方でもずっと続く</li>
      <li>敵は本陣のまわりに柵・櫓と<b>守備隊</b>を置き、近づくと迎え撃ってくる。攻めてくるのは開戦からしばらくたってから</li>
      <li>自陣（下の青い帯）をタップして兵・設備を置く。なぞると続けて置ける。兵は命令しない限り動かない</li>

      <li>ブラウザの共有メニューから<b>ホーム画面に追加</b>すると、アプリのように全画面で開き、一度開いたあとは電波がなくても遊べる</li>
      <li>戦場は2本指で動かす・拡大。右下の地図をタップでその場所へ。「視点」で1本指で動かせる</li>
      <li><b>全国戦では味方の近くの敵しか見えない</b>。騎馬を先に走らせて様子を見よう</li>
      <li><b>川</b>は橋か浅瀬でしか渡れない。<b>岩山</b>と<b>池</b>は通れない。<b>森</b>は遅いが矢を防ぐ。<b>道</b>は速い</li>
      <li><b>堀</b>は自陣に掘れる（12MP）。味方の柵・城壁・櫓や兵（2人以上）のそばなら自陣の外にも掘れるが、MPは2倍（24MP）。中は歩く速さが1/5になる。敵の<b>工兵</b>は堀を少しずつ埋めてくる。<b>落とし穴</b>は敵が落ちるとしばらく出られない（7人で埋まる）</li>
      <li><b>築城</b>：柵→<b>石垣</b>(60)→<b>多聞櫓</b>(150)、櫓→<b>天守</b>(300)→<b>大天守</b>(600)。となり合う石垣はつながって城壁になる。天守は強い矢で守りMPも増える。</li>
      <li><b>神社</b>（MP250、自陣に3つまで）：1つごとに味方の攻撃+5%、受けるダメージ-5%。敵も陣が進むと神社を建てる</li>
      <li><b>船着場</b>（MP80）を水辺に建てると、そこから<b>船</b>（MP100）を出せる。船は水の上だけを進み弓で岸を射る（届くのは矢だけ）。兵を選んで船をタップすると乗船（船20人・関船40人・安宅船80人。船と乗っている兵は兵数の上限1000人とは別枠で、全部で500人まで）、船を選んで陸をタップすると岸へ向かい、絶壁でなければどこにでも上陸する。船着場のそばで「築城」すると<b>関船</b>(150)→<b>安宅船</b>(300)。船着場を築城すると<b>造船所</b>(400)になり、そのそばで安宅船を<b>鉄甲船</b>(600・300人乗り)にでき、船に乗れる兵が全部で1000人になる。船を選んでその船をタップすると、その場で上陸。全国戦では船は北陸から、弓騎は2つ目の地方から、赤備は山陽（中国地方）から使える</li>
      <li><b>柵・石垣のすぐ後ろ</b>で待機している兵は、剣・槍・騎馬でも、塀に近づく敵に弓を射かける（弓兵より少し弱い）</li>
      <li><b>敵陣の柵</b>：その場に味方が10人以上いて、近くの敵の2倍以上いれば、敵陣の中にも柵を建てられる</li>

      <li>味方は黒い具足、敵は青い具足</li>
      <li>相性：槍→騎、騎→弓、弓→剣、剣→槍。<b>坂の上から</b>攻めると最大1.8倍、坂の下から攻めると弱くなる。弓は高い所ほど遠くまで届く。敵の部隊を<b>はさんで反対側</b>にも味方の部隊がいれば、少し離れていても<b>挟み撃ち</b>（攻撃力×1.6、弓も含む）。挟まれた部隊には「挟」の印が出る。<b>味方の柵・塀のすぐ後ろ</b>にいる部隊は挟み撃ちされない</li>
      <li>戦場の<b>砦</b>のまわりに味方だけがいると奪える（MP +3/秒）。敵の本陣を落とせば勝ち</li>
`}
    </ul>
    <button class="big" id="hBack">${TT('戻る','Back')}</button>
  </div>`);
  $('#hBack').onclick=()=>{SFX.click();helpBack();};
}

const tutEl=$('#tut');let tutShown=-2;
function tcount(k){let n=0;for(const e of S.ents)if(e.side===0&&e.kind===k)n++;return n}
function beginTutorial(){S.tut=0;tutShown=-2;tutEl.hidden=false;updTutorial();}
function endTutorial(silent){
  S.tut=-1;SAVE.tut=1;save();tutEl.hidden=true;
  document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));
  S.waveT=Math.min(S.waveT,15);
  if(!silent&&S.phase==='battle'){aiFlank(S.ents.filter(e=>e.side===1&&!e.k.build&&!e.guard));aiSendToForts(.4);}
}
function updTutorial(){
  if(!S||S.tut<0)return;
  const st=TUT[S.tut];
  if(st.L&&MODE==='local'){S.tut++;if(S.tut>=TUT.length){endTutorial();return;}return updTutorial();}
  if(st.done&&st.done()){SFX.click();S.tut++;if(S.tut>=TUT.length){endTutorial();return;}return updTutorial();}
  if(tutShown!==S.tut){
    tutShown=S.tut;
    $('#tutText').innerHTML=EN()&&st.te?st.te:st.t;$('#tutStep').textContent=(S.tut+1)+' / '+TUT.length;
    const nb=$('#tutNext');nb.hidden=!st.next;nb.textContent=(EN()?st.nexte:st.next)||'';
    document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));
    if(st.hl)$(st.hl).classList.add('tut-hl');
  }
}
$('#tutNext').onclick=()=>{SFX.click();S.tut++;if(S.tut>=TUT.length)endTutorial();else updTutorial();};
$('#tutSkip').onclick=()=>{SFX.click();endTutorial();toast(TT('チュートリアルを飛ばしました','Tutorial skipped'));};

function centroid(us){let x=0,y=0;for(const e of us){x+=e.x;y+=e.y;}return[x/us.length,y/us.length];}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function lassoSelect(P){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of P){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}
  return S.ents.filter(e=>e.side===0&&!e.k.build&&(filt==='all'||e.kind===filt)&&e.x>=x0&&e.x<=x1&&e.y>=y0&&e.y<=y1&&inPoly(e.x,e.y,P));
}
function squadAt(sx,sy){
  if(cam.z>=.42)return null;
  const agg=new Map();
  for(const e of S.ents){if(e.side!==0||e.k.build)continue;let a=agg.get(e.sq);if(!a){a={x:0,y:0,n:0};agg.set(e.sq,a);}a.x+=e.x;a.y+=e.y;a.n++;}
  let best=null,bd=24;
  for(const[id,a]of agg){const p=toScreen(a.x/a.n,a.y/a.n),d=Math.hypot(p[0]-sx,p[1]-sy+10);if(d<bd){bd=d;best=id;}}
  return best;
}
function genAt(sx,sy){let best=null,bd=26;for(const e of S.ents){if(e.side!==0||!e.k.gen)continue;const p=toScreen(e.x,e.y),d=Math.hypot(p[0]-sx,p[1]-sy+12);if(d<bd){bd=d;best=e;}}return best;}

function order(us,ex,ey){
  const build=S.phase==='build';
  if(build)ey=Math.max(ey,PZ+5);
  // tap your own ship with soldiers selected: they walk to the shore and go aboard
  const land0=us.filter(u=>!u.k.ship);
  if(land0.length){let tgt=null,bd=1e9;for(const e of S.ents)if(e.side===0&&e.k.ship&&e.hp>0){const d=Math.hypot(e.x-ex,e.y-ey)-e.r;if(d<16&&d<bd){bd=d;tgt=e;}}
    if(tgt){const fl=fieldTo(tgt.x,tgt.y);let n=0;for(const u of land0){if(u.k.gen)continue;u.boardOn=tgt;u.lord=null;u.st='move';u.then='hold';u.ax=tgt.x;u.ay=tgt.y;u.gx=tgt.x;u.gy=tgt.y;u.fld=fl;u.tg=null;n++;}
      toast(TT(n+'人が船に向かう（'+nm(tgt.k)+'：'+cargoN(tgt)+'/'+tgt.k.cap+'人）',n+' troops heading aboard ('+nm(tgt.k)+': '+cargoN(tgt)+'/'+tgt.k.cap+')'));S.tutMoved=1;SFX.click();return'board';}}
  const ships=us.filter(u=>u.k.ship);
  // tap the selected ship itself: put its troops ashore right where it is

    if(me){let n=0;for(const s of ships)if(cargoN(s)){s.unload={x:s.x,y:s.y};s.st='hold';s.ax=s.x;s.ay=s.y;s.unloadT=0;n++;}
      if(n){toast(TT('その場で上陸する','Landing right here'));SFX.click();return'unload';}}}
  // a ship with troops aboard ordered onto land sails to the nearest shore and puts them ashore there
  for(const u of ships){u.unload=cargoN(u)&&passable(ex,ey)?{x:ex,y:ey}:null;}
  const unl=ships.some(u=>u.unload);
  if(ships.length){const fw=fieldToW(ex,ey);
    if(fw){const sx=fw.D&&fw.D[cellOf(ex,ey)]<1e9?ex:fw.gx,sy=fw.D&&fw.D[cellOf(ex,ey)]<1e9?ey:fw.gy;const[cx,cy]=centroid(ships);
      for(const u of ships){let ox=(u.x-cx)*.8,oy=(u.y-cy)*.8;const L=Math.hypot(ox,oy);if(L>40){ox*=40/L;oy*=40/L;}let ax=sx+ox,ay=sy+oy;if(!water(ax,ay)){ax=sx;ay=sy;}
        u.ax=ax;u.ay=ay;u.gx=sx;u.gy=sy;u.st='move';u.fld=fw;u.tg=null;u.rt=0;}}

  const fl=fieldTo(ex,ey);
  if(!fl){toast(TT('そこへは行けません','Can\'t go there'));return'x';}
  const[cx,cy]=centroid(us);

  const gens=us.filter(u=>u.k.gen);
  for(const u of us){
    if(u.lord&&gens.includes(u.lord)&&u.st==='gen')continue;
    if(!u.k.gen)u.lord=null;else u.userMove=1;
    let ox=(u.x-cx)*.85,oy=(u.y-cy)*.85;const L=Math.hypot(ox,oy);if(L>44){ox*=44/L;oy*=44/L;}
    let ax=clamp(ex+ox,5,W-5),ay=clamp(ey+oy,build?PZ+5:5,H-5);
    if(!passable(ax,ay)){ax=ex;ay=ey;}
    u.ax=ax;u.ay=ay;u.gx=ex;u.gy=ey;u.st='move';u.fld=fl;u.tg=null;u.rt=0;u.boardOn=null;
    if(u.k.ninja&&!build){u.then='return';if(u.y>=PZ)u.home={x:u.x,y:u.y};else if(!u.home)u.home={x:u.x,y:PZ+40};}
  }
  S.tutMoved=1;SFX.click();
  S.fx.push({ty:'flag',x:ex,y:ey,life:.9,max:.9});
}

const pts=new Map();let drag=null,trenchLink=-1;

  }

  if(mode==='pan'){drag={type:'pan',lx:sx,ly:sy,sx,sy,quiet:1};return;}

  const k=K[sel];

  const g={type:'pending',wx,wy,sx,sy};
  g.timer=setTimeout(()=>{if(drag===g){g.type='place';g.timer=null;place(wx,wy);g.last=[wx,wy];}},70);
  drag=g;
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!drag)return;
  const[sx,sy]=local(e);pts.set(e.pointerId,{sx,sy});
  if(drag.type==='pinch'){
    if(pts.size<2)return;
    const[a,b]=[...pts.values()],mx=(a.sx+b.sx)/2,my=(a.sy+b.sy)/2;
    cam.z=clamp(drag.z0*Math.hypot(a.sx-b.sx,a.sy-b.sy)/drag.d0,fitZ,ZMAX);
    camAt(drag.mw[0],drag.mw[1],mx,my);return;
  }
  const[wx,wy]=toWorld(sx,sy);
  if(drag.type==='lasso'){const d=Math.hypot(sx-drag.lx,sy-drag.ly);if(d>3){drag.len+=d;drag.lx=sx;drag.ly=sy;drag.pts.push([wx,wy]);}}
  else if(drag.type==='pan'){panBy(sx-drag.lx,sy-drag.ly);drag.lx=sx;drag.ly=sy;}
  else if(drag.type==='pending'&&Math.hypot(sx-drag.sx,sy-drag.sy)>6){clearTimeout(drag.timer);drag.timer=null;drag.type='place';place(drag.wx,drag.wy);drag.last=[drag.wx,drag.wy];}

    }else if(Math.hypot(wx-drag.last[0],wy-drag.last[1])>=th){place(wx,wy);drag.last=[wx,wy];}

});
function up(e){

        toast(EN()?Object.keys(c).map(k=>c[k]+' '+nm(K[k])).join(', ')+' selected. Tap where to go':Object.keys(c).map(k=>K[k].n+c[k]).join('・')+' を選択。行き先をタップ');}
      else{S.sel=[];toast(filt==='all'?TT('囲んだ中に味方がいません','None of your troops in the circle'):TT('囲んだ中に'+K[filt].n+'がいません','No '+nm(K[filt])+' in the circle'));}
    }

  }else if(drag.type==='pan'&&!drag.quiet&&Math.hypot(sx-drag.sx,sy-drag.sy)<6){
    const k=K[sel];toast(sel==='trench'?TT('堀は自陣か、味方の柵・城壁・櫓や兵のそばに掘れます（自陣の外はMP2倍）','Moats go in your camp or next to your fences, walls, towers or troops (double MP outside the camp)'):k.build?TT('櫓・柵は自陣か、味方が3人以上いる場所に建てられる','Build in your camp or where 3+ of your troops stand'):TT('兵を出せるのは自陣だけ。動かすには「指揮」','Troops can only be placed in your camp. Use Command to move them'));
  }
  if(pts.size===0)drag=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{
  e.preventDefault();const[sx,sy]=local(e);const[wx,wy]=toWorld(sx,sy);
  cam.z=clamp(cam.z*Math.exp(-e.deltaY*.0015),fitZ,ZMAX);
