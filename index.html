<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141817">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>武家合戦</title>
<meta name="app-id" content="buke-kassen">
<meta name="description" content="武士と足軽、千の兵を丸で囲んで指揮する戦国合戦ゲーム。家紋を掲げ、関東から国を攻め取り天下統一をめざせ。">
<meta property="og:type" content="website">
<meta property="og:title" content="武家合戦">
<meta property="og:description" content="千の兵を率いて、敵の本陣を落とせ。スマホでそのまま遊べる戦国合戦ゲーム。">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="武家合戦">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#141817; --panel:#1f2523; --panel2:#29302d; --line:#3a433f;
  --paper:#ece6d6; --muted:#a3a894;
  --ai:#d9a93a; --shu:#e0553a; --kin:#dcae45; --teki:#4a7ef0;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:5px;padding:5px 16px}
#app{padding-top:max(5px,env(safe-area-inset-top,0px));padding-bottom:max(5px,env(safe-area-inset-bottom,0px))}
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.lv{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:19px;letter-spacing:.04em;white-space:nowrap}
.phase{display:flex;flex-direction:column;gap:3px;min-width:0}
.phase-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);gap:6px}
.phase-row b{color:var(--paper);font-size:14px;font-weight:700}
.tabnum{font-variant-numeric:tabular-nums}
.hq{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.hqbar{flex:1;height:5px;background:#0b0d0c;border-radius:3px;overflow:hidden}
.hqbar i{display:block;height:100%;width:100%}
#hqE i{background:var(--teki)} #hqP i{background:var(--ai)}
.ub canvas{background:radial-gradient(circle at 50% 40%,#d9d1b8,#8d8672);border-radius:5px}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--paper);font:700 15px/1 inherit;cursor:pointer}
.mp{position:relative;height:20px;background:#0b0d0c;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
#mpFill{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#8a6a1f,var(--kin));width:0}
.mp>span{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000}
#stage{flex:1;min-height:0;position:relative;border-radius:4px;overflow:hidden;background:#0d100f;box-shadow:0 0 0 1px #000}
#cv{display:block;width:100%;height:100%}
#toast{position:absolute;left:50%;bottom:12px;z-index:4;transform:translateX(-50%);background:rgba(10,12,11,.88);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:92%;text-align:center}
#toast.on{opacity:1}
.units{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;flex:none}
.ub{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:8px;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-family:inherit;min-width:0}
.ub svg{width:22px;height:20px;color:var(--ai)}
.ub canvas{width:26px;height:24px}
.ub .nm{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:13px;line-height:1}
.ub .ct{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ub.cmd svg{color:var(--kin)}
.ub.sel{border-color:var(--kin);background:#3a3322;box-shadow:inset 0 0 0 1px var(--kin)}
.ub.poor{opacity:.45}
.ub:focus-visible,.cb:focus-visible,.iconbtn:focus-visible,.big:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
.ctrl{display:grid;grid-template-columns:1.35fr 1.15fr .55fr .6fr .6fr;gap:4px;flex:none}
.cb{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--paper);border-radius:8px;height:34px;font:700 13px/1 inherit;font-family:inherit;cursor:pointer}
.cb.hot{background:#6e2718;border-color:var(--shu)}
.cb:disabled{opacity:.35}
.iconbtn{display:flex;align-items:center;justify-content:center}
#ov .pastc{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
#ov .pastc img{width:100%;border-radius:4px;display:block}
#ov .pastc .row2{align-items:center}
#ov .pastc b{font-family:"Shippori Mincho B1",serif;font-size:15px}
#genBar{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:3;display:flex;gap:6px;align-items:center;background:rgba(18,21,20,.93);border:1px solid var(--kin);border-radius:22px;padding:5px 6px 5px 12px;box-shadow:0 6px 20px rgba(0,0,0,.45);white-space:nowrap}
#genBar b{font-size:12px;color:var(--kin);margin-right:2px}
#genBar .cb{height:32px;padding:0 14px;font-size:14px;font-family:"Shippori Mincho B1",serif}
#tut{position:absolute;left:8px;right:8px;top:8px;z-index:3;background:rgba(18,21,20,.93);border:1px solid var(--kin);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#tut p{margin:0;font-size:13.5px;line-height:1.6}
#tut b{color:var(--kin)}
.tut-row{display:flex;align-items:center;gap:6px}
.tut-row .sp{flex:1}
#tutStep{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tut-row .cb{height:30px;padding:0 12px;font-size:12px}
.tut-hl{animation:tutPulse 1.1s ease-in-out infinite;border-color:var(--kin)!important}
@keyframes tutPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,174,69,.9)}50%{box-shadow:0 0 0 5px rgba(220,174,69,0)}}
@media (prefers-reduced-motion:reduce){.tut-hl{animation:none;box-shadow:0 0 0 3px var(--kin)}}
.card.title{text-align:center}
.card .big{font-size:clamp(16px,5vw,20px);letter-spacing:.08em;line-height:1.3}
.card .lead{font-size:14px;color:var(--paper);opacity:.85}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cb.ghost{background:transparent}
.card .cb{height:40px}
.overlay{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(12,14,13,.9);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;overflow:auto}
.card{max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;margin:auto}
.card h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:38px;margin:0;letter-spacing:.08em}
.card h1 em{font-style:normal;color:var(--shu)}
.card h2{font-family:"Shippori Mincho B1",serif;font-size:30px;margin:0}
.card p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.card ul{margin:0;padding-left:1.1em;font-size:12.5px;line-height:1.6}
.card li b{color:var(--kin)}
.big{appearance:none;border:0;background:var(--shu);color:#fff;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:20px;letter-spacing:.2em;padding:12px;border-radius:6px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.stats small{display:block;color:var(--muted);font-size:11px}

#mini{position:absolute;right:8px;bottom:8px;width:84px;height:150px;border:1px solid rgba(236,230,214,.55);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.5);z-index:2;touch-action:none;background:#0d100f}
#forts{position:absolute;left:8px;bottom:8px;z-index:2;display:flex;gap:4px;pointer-events:none}
#forts span{font:700 11px/1 "Shippori Mincho B1",serif;padding:4px 5px;border-radius:3px;background:rgba(14,16,15,.8);border:1px solid var(--line);color:var(--muted)}
#forts span.p{color:#fff;background:#24428c;border-color:#5b82ea}
#forts span.e{color:#fff;background:#8c2a1c;border-color:#e0553a}
#loading{position:absolute;top:0;right:0;bottom:0;left:0;z-index:6;background:#101312;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--paper)}
#loading b{font-family:"Shippori Mincho B1",serif;font-size:20px;letter-spacing:.2em}
#loading .bar{width:60%;height:4px;background:#2a302d;border-radius:2px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--kin)}
.kanhd{appearance:none;display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--paper);font-family:inherit;cursor:pointer}
.kanhd canvas{width:56px;height:56px;flex:none}
.card canvas.portrait{width:120px;height:120px;align-self:center}
.kanhd span{display:flex;flex-direction:column;gap:2px;min-width:0}
.kanhd small{font-size:11px;color:var(--muted)}
.kanhd b{font-family:"Shippori Mincho B1",serif;font-size:18px;color:var(--kin);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kanhd i{font-style:normal;font-size:11px;color:var(--muted)}
.nmrow{display:flex;align-items:flex-end;gap:6px}
.nmrow label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.nmrow span{font-family:"Shippori Mincho B1",serif;font-size:20px;padding-bottom:6px}
.nmin{appearance:none;background:#0e1110;border:1px solid var(--line);border-radius:8px;color:var(--paper);font:700 18px/1.2 "Shippori Mincho B1",serif;padding:8px 10px;user-select:text;-webkit-user-select:text;touch-action:auto;width:100%;box-sizing:border-box}
.nmin:focus{outline:2px solid var(--kin);outline-offset:1px}
.kangrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kangrid.k3{grid-template-columns:1fr 1fr 1fr}
.kangrid .cb{height:auto;min-height:40px;padding:6px 4px;font-family:"Shippori Mincho B1",serif;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.kangrid .cb em{font:500 9.5px/1.15 inherit;font-style:normal;color:var(--muted);text-align:center}
html[lang=en] .ub .nm{font-size:10px;letter-spacing:-.02em;white-space:nowrap}
html[lang=en] .kangrid .cb{font-family:inherit;font-size:13px}
.langrow{align-items:center;grid-template-columns:1fr auto}
.kangrid .cb small{font:700 9px/1 inherit;color:var(--kin);opacity:.8}
.nmprev{text-align:center;font-size:13px}.nmprev b{font-family:"Shippori Mincho B1",serif;font-size:17px;color:var(--kin)}
.ladder{font-size:12px;color:var(--muted)}.ladder summary{cursor:pointer}
.ladder ol{margin:6px 0 0;padding-left:1.4em;line-height:1.7}.ladder li.done{opacity:.55}.ladder li.on{color:var(--paper)}.ladder li.on b{color:var(--kin)}
.flagrow{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.flagb{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:8px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 11px/1 inherit;font-family:inherit;cursor:pointer}
.flagb i{display:block;width:16px;height:24px;border-radius:1px;background:linear-gradient(90deg,var(--fc),var(--fd));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.flagb.on{border-color:var(--kin);background:#3a3322}
#phase{white-space:nowrap}
#updBar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;background:#1f2523;border:1px solid var(--kin);border-radius:10px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:13px;white-space:nowrap}
#updBar .cb{height:32px;padding:0 10px}
.card .ver{text-align:center;font-size:11px;opacity:.6}
.finale{max-width:420px}
.fin-h{text-align:center;font-size:40px!important;color:var(--kin);letter-spacing:.2em}
.fin-who{text-align:center}.fin-who b{color:var(--kin);font-family:"Shippori Mincho B1",serif}
.parade{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.fin-cap{text-align:center;font-size:12px;color:var(--muted)}
.fin-armies{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fin-armies span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px}
.fin-armies b{color:var(--kin);margin-right:6px;font-family:"Shippori Mincho B1",serif}
.fin-note{font-size:11px;text-align:center}
.fin-h3{font-family:"Shippori Mincho B1",serif;margin:4px 0 0;font-size:20px}
.fin-path{display:flex;flex-direction:column;gap:6px}
.fin-reg{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.fin-reg img,.fin-reg i{width:64px;height:48px;object-fit:cover;border-radius:4px;flex:none;background:#2a302d}
.fin-reg div{display:flex;flex-direction:column;gap:2px;min-width:0}.fin-reg b{font-family:"Shippori Mincho B1",serif;color:var(--kin)}
.fin-reg small{font-size:11px;color:var(--muted)}
.cb.on{background:#3a3322;border-color:var(--kin);color:#ffe8a8}
.ub canvas{width:22px;height:20px}
.ub{padding:3px 0 2px}.ub .nm{font-size:12px}
.ub.lock{opacity:.35;filter:grayscale(1)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;font-family:inherit;text-align:center}
.mode b{font-family:"Shippori Mincho B1",serif;font-size:19px}
.mode small{font-size:11px;color:var(--muted);line-height:1.4}
.mode.on{border-color:var(--kin);background:#3a3322;box-shadow:inset 0 0 0 1px var(--kin)}
body.local #mini{display:none}
@supports (height:100dvh){#app{height:100dvh}}
button{touch-action:manipulation}
.monbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.monbtn canvas{width:26px;height:26px}
.mongrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mongrid button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px/1.2 inherit;font-family:inherit;cursor:pointer}
.mongrid button.on{border-color:var(--kin);background:#3a3322}
.mongrid canvas{width:54px;height:54px}
body.imm header,body.imm .mp{display:none}
body.imm #app{padding:0 max(4px,env(safe-area-inset-right,0px)) 2px max(4px,env(safe-area-inset-left,0px));gap:3px}
body.imm #stage{border-radius:0}
#immHud{position:absolute;left:6px;top:6px;z-index:3;display:flex;gap:8px;align-items:center;background:rgba(14,16,15,.78);border:1px solid var(--line);border-radius:18px;padding:3px 4px 3px 10px;font-size:12px}
#immHud b{color:var(--kin);font-variant-numeric:tabular-nums}
#immHud span{font-variant-numeric:tabular-nums;color:var(--paper)}
#immHud button{appearance:none;border:0;background:var(--panel2);color:var(--paper);width:26px;height:26px;border-radius:50%;font:700 11px/1 inherit;cursor:pointer}
.modes{grid-template-columns:repeat(3,1fr)!important;gap:6px}
.mode{padding:8px 4px}.mode b{font-size:17px}.mode small{font-size:10px}.mode i{font-style:normal;font-size:10px;color:var(--kin)}
.ub .ct{font-size:9px}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;min-width:0}
#side{display:flex;flex-direction:column;gap:4px;flex:none}
.hbtns{display:flex;gap:6px}
.ub.cmd{grid-column:span 1}
body.rot #app{max-width:none;flex-direction:row;padding:4px max(8px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px));gap:8px}
body.rot #side{width:min(300px,34vw);justify-content:flex-end;overflow-y:auto}
body.rot .units{grid-template-columns:repeat(4,1fr)}
body.rot .ub.cmd{grid-column:span 1}
body.rot .ctrl{grid-template-columns:1fr 1fr 1fr;}
body.rot .ctrl #modeBtn,body.rot .ctrl #startBtn{grid-column:span 3/span 3}
body.rot #mini{width:150px;height:84px}
body.rot header{gap:6px}
body.rot .lv{font-size:16px}
@media (orientation:landscape) and (max-height:500px){body.rot .phase-row{font-size:11px}body.rot .mp{height:16px}}
</style>

<div id="app">
 <div id="main">
  <header>
    <div class="lv" id="lv">第1陣</div>
    <div class="phase">
      <div class="phase-row"><b id="phase">陣地構築</b><span class="tabnum" id="time">1:30</span><span class="tabnum"><span data-en="Us">味方</span> <b id="cntP">0</b> ・ <span data-en="Foe">敵</span> <b id="cntE">0</b></span></div>
      <div class="hq"><span data-en="Enemy HQ">敵本陣</span><div class="hqbar" id="hqE"><i></i></div><span data-en="Your HQ">自本陣</span><div class="hqbar" id="hqP"><i></i></div></div>
    </div>
    <div class="hbtns"><button class="iconbtn" id="fullBtn" aria-label="全画面" data-ena="Fullscreen"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M1.5 4.5v-3h3M7.5 1.5h3v3M10.5 7.5v3h-3M4.5 10.5h-3v-3" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
    <button class="iconbtn" id="helpBtn" aria-label="一時停止" data-ena="Pause"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="1.5" width="2.6" height="9" rx=".6" fill="currentColor"/><rect x="7.4" y="1.5" width="2.6" height="9" rx=".6" fill="currentColor"/></svg></button></div>
  </header>
  <div class="mp"><div id="mpFill"></div><span><span class="tabnum" id="mpTxt">MP 0</span><span class="tabnum" id="rate">+8.0/秒</span></span></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="mini" aria-label="戦場の地図。タップでその場所へ移動" data-ena="Battlefield map. Tap to jump there"></canvas>
    <div id="forts"></div>
    <div id="toast"></div>
    <div id="immHud" hidden><b id="imMP">MP</b><span id="imTime"></span><button id="immPause" aria-label="一時停止" data-ena="Pause">❚❚</button><button id="immExit" aria-label="全画面をやめる" data-ena="Exit fullscreen">×</button></div>
    <div id="genBar" hidden><b id="genTxt">将軍</b><button class="cb" id="gAtk" data-en="Attack">攻勢</button><button class="cb" id="gHold" data-en="Hold">死守</button><button class="cb ghost" id="gFree" data-en="Release">解散</button></div>
    <div id="tut" hidden><p id="tutText"></p><div class="tut-row"><span id="tutStep"></span><span class="sp"></span><button class="cb" id="tutSkip" data-en="Skip">飛ばす</button><button class="cb hot" id="tutNext" data-en="Next">次へ</button></div></div>
    <div class="overlay" id="ov" hidden></div>
    <div id="loading" hidden><b data-en="Deploying">布陣中</b><div class="bar"><i id="loadBar"></i></div><small id="loadTxt">地形をつくっています</small></div>
  </div>
 </div>
 <div id="side">
  <div class="units" id="units"></div>
  <div class="ctrl">
    <button class="cb" id="modeBtn">全軍突撃</button>
    <button class="cb hot" id="startBtn">開戦する</button>

// fg = crest colour, bg = field colour (null: no disc), cut = colour used for the white lines inside the crest
function drawMon(g,id,cx,cy,r,fg,bg,cut){
  const P=Math.PI*2;cut=cut||bg||'#b31d12';
  g.save();g.translate(cx,cy);g.scale(r,r);
  if(bg){g.beginPath();g.arc(0,0,1,0,P);g.fillStyle=bg;g.fill();}

  const ring=(ro,ri)=>{g.beginPath();g.arc(0,0,ro,0,P);g.arc(0,0,ri,0,P,true);F(fg);};
  const clipIn=rr=>{g.save();g.beginPath();g.arc(0,0,rr,0,P);g.clip();};
  // one tomoe comma: round head, tail sweeping clockwise along the outer circle
  const tomoe=(a0,R,d,h,span,th)=>{
    g.save();g.rotate(a0);
    circ(0,-d,h);F(fg);
    const pts=[],N=40,sp=span*Math.PI/180;
    for(let i=0;i<=N;i++){const f=i/N,ph=f*sp,ro=d+h+(R-d-h)*Math.min(1,f*sp/(1.05)),t=th*Math.pow(1-f,.85);pts.push([ph,ro,Math.max(ro-t,0)]);}
    g.beginPath();pts.forEach(([ph,ro],i)=>{const x=Math.sin(ph)*ro,y=-Math.cos(ph)*ro;i?g.lineTo(x,y):g.moveTo(x,y);});
    for(let i=pts.length-1;i>=0;i--){const[ph,,ri]=pts[i];g.lineTo(Math.sin(ph)*ri,-Math.cos(ph)*ri);}
    g.closePath();F(fg);g.restore();};
  switch(id){
    case'mitsudomoe':for(let i=0;i<3;i++)tomoe(i*P/3,.97,.42,.29,168,.34);break;
    case'fujidomoe':{// 黒田藤巴: wisteria blossoms curled into a single tomoe, leaves sprouting from the head
      tomoe(-.35,.97,.26,.5,290,.5);
      g.save();g.rotate(-.35);
      const cup=(x,y,s,a)=>{g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.arc(0,0,s,.2,Math.PI-.2);S(cut,s*.34);g.restore();};
      for(let k=0;k<4;k++)for(let m=0;m<5;m++){const x=(m-2)*.19+(k%2)*.095,y=-.26+(k-1.5)*.17;if(Math.hypot(x,y+.26)<.4)cup(x,y,.07,0);}
      for(let i=0;i<30;i++){const ph=.75+i*.155,deg=ph*180/Math.PI;if(deg>285)break;const th=.5*Math.pow(1-deg/290,.85),ro=.97,s2=Math.max(.018,th*.2);
        const rows=th>.3?3:th>.15?2:1;for(let q=0;q<rows;q++){const rr=ro-th*(q+.5)/rows;cup(Math.sin(ph+(q%2)*.07)*rr,-Math.cos(ph+(q%2)*.07)*rr,s2,ph);}}
      // leaves (white on the dark head)
      const leaf=(x,y,a,l,w)=>{g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(l*.5,-w,l,0);g.quadraticCurveTo(l*.5,w,0,0);S(cut,.03);
        g.beginPath();g.moveTo(l*.1,0);g.lineTo(l*.85,0);S(cut,.02);g.restore();};
      g.restore();
      break;}
    case'bishi':{// 割菱: four equal lozenges with narrow white seams
      const w=.48,h=.48,gp=.035;
      for(const[ox,oy]of[[0,-1],[-1,0],[1,0],[0,1]]){const x=ox*(w+gp),y=oy*(h+gp);
        g.beginPath();g.moveTo(x,y-h);g.lineTo(x+w,y);g.lineTo(x,y+h);g.lineTo(x-w,y);g.closePath();F(fg);}break;}
    case'rokumon':// 六連銭: coins with rim line and square hole
      for(let j=0;j<2;j++)for(let i=0;i<3;i++){const x=(i-1)*.62,y=(j-.5)*.64;
        circ(x,y,.3);F(fg);circ(x,y,.235);S(cut,.03);g.fillStyle=cut;g.fillRect(x-.075,y-.075,.15,.15);}

    case'kikyo':{// 桔梗: five pointed petals, white seams, stamen at the centre

      g.closePath();F(fg);

      for(let i=0;i<5;i++){const a=i*P/5-Math.PI/2;circ(Math.cos(a)*.33,Math.sin(a)*.33,.035);F(cut);}
      break;}
    case'kuyo':circ(0,0,.3);F(fg);for(let i=0;i<8;i++){const a=i*P/8;circ(Math.cos(a)*.7,Math.sin(a)*.7,.23);F(fg);}break;
    case'hikiryo':ring(.98,.84);clipIn(.85);for(const y of[-.4,0,.4]){g.fillStyle=fg;g.fillRect(-1,y-.12,2,.24);}g.restore();break;
    case'juji':ring(.98,.84);clipIn(.85);g.fillStyle=fg;g.fillRect(-1,-.11,2,.22);g.fillRect(-.11,-1,.22,2);g.restore();break;
    case'mokko':{// 織田木瓜: five lobes, inner outline, 唐花 in the centre
      const lobes=(s,c)=>{g.beginPath();for(let i=0;i<5;i++){const a=i*P/5-Math.PI/2;g.moveTo(Math.cos(a)*.5*s+.44*s,Math.sin(a)*.5*s);g.arc(Math.cos(a)*.5*s,Math.sin(a)*.5*s,.44*s,0,P);}g.moveTo(.5*s,0);g.arc(0,0,.5*s,0,P);F(c);};

      for(let i=0;i<5;i++){const a=i*P/5-Math.PI/2+Math.PI/5;circ(Math.cos(a)*.3,Math.sin(a)*.3,.03);F(cut);}
      for(let i=0;i<5;i++){const a=i*P/5-Math.PI/2;g.beginPath();g.moveTo(Math.cos(a)*.09,Math.sin(a)*.09);g.lineTo(Math.cos(a)*.2,Math.sin(a)*.2);S(fg,.03);}
      break;}
    case'myoga':{// 抱き茗荷: two broad ginger shoots embracing, tips meeting at the top, bud at the root
      const bz=(p,t)=>{const u=1-t;return[u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1]];};
      for(const sd of[-1,1]){
        const O=[[sd*.06,.9],[sd*1.02,.8],[sd*1.1,-.5],[0,-.96]],I=[[0,-.96],[sd*.42,-.6],[sd*.38,.4],[sd*.04,.72]];
        g.beginPath();g.moveTo(O[0][0],O[0][1]);g.bezierCurveTo(O[1][0],O[1][1],O[2][0],O[2][1],O[3][0],O[3][1]);
        g.bezierCurveTo(I[1][0],I[1][1],I[2][0],I[2][1],I[3][0],I[3][1]);g.closePath();F(fg);
        // slanting ribs, leaving a dark margin on both edges
        g.beginPath();
        for(let k=0;k<10;k++){const t=.16+k*.078,a=bz(O,t),b=bz(I,Math.min(1,Math.max(0,1-t-.13)));
          g.moveTo(a[0]*.86+b[0]*.14,a[1]*.86+b[1]*.14);g.lineTo(a[0]*.14+b[0]*.86,a[1]*.14+b[1]*.86);}
        S(cut,.042);
        // centre vein
        g.beginPath();for(let k=0;k<=24;k++){const t=.03+k*.037,a=bz(O,t),b=bz(I,1-t);const x=(a[0]+b[0])/2,y=(a[1]+b[1])/2;k?g.lineTo(x,y):g.moveTo(x,y);}S(cut,.03);

/* ---------- flow fields (Dijkstra over the grid) ---------- */
function dijkstra(goals){
  const D=new Float32Array(NC).fill(1e9),nb=new Int8Array(NC).fill(-2),done=new Uint8Array(NC);let n=0;

  const pop=()=>{const v=HV[0],lk=HK[--n],lv=HV[n];let i=0;for(;;){let l=2*i+1;if(l>=n)break;if(l+1<n&&HK[l+1]<HK[l])l++;if(HK[l]>=lk)break;HK[i]=HK[l];HV[i]=HV[l];i=l;}HK[i]=lk;HV[i]=lv;return v;};
  for(const g of goals){if(blk[g])continue;D[g]=0;nb[g]=-1;push(0,g);}
  while(n>0){
    const c=pop();if(done[c])continue;done[c]=1;
    const cx=c%GW,cy=(c/GW)|0;
    for(let k=0;k<8;k++){
      const x=cx+DXs[k],y=cy+DYs[k];if(x<0||y<0||x>=GW||y>=GH)continue;
      const m=y*GW+x;if(blk[m])continue;
      if(k>=4&&(blk[cy*GW+x]||blk[y*GW+cx]))continue;
      if(done[m])continue;
      const nd=Math.fround(D[c]+(k<4?1:1.414)*cost[m]*(TR&&TR[m]?5:1));
      if(nd<D[m]){D[m]=nd;nb[m]=k^1;push(nd,m);}
    }
  }

}

  const pop=()=>{const v=HV[0],lk=HK[--n],lv=HV[n];let i=0;for(;;){let l=2*i+1;if(l>=n)break;if(l+1<n&&HK[l+1]<HK[l])l++;if(HK[l]>=lk)break;HK[i]=HK[l];HV[i]=HV[l];i=l;}HK[i]=lk;HV[i]=lv;return v;};
  for(const g of goals){if(blk[g]!==2)continue;D[g]=0;nb[g]=-1;push(0,g);}

// fences in the enemy camp: 10+ of your soldiers close by, and at least twice the enemy soldiers around
const ENEMY_FENCE_N=10;

    ctx.beginPath();for(const t of vis){if(t.l>=0&&T[t.l]){const q=T[t.l];ctx.moveTo(q.x+dx,q.y+dy);ctx.lineTo(t.x+dx,t.y+dy);}}ctx.stroke();};
  pass(24,'rgba(0,0,0,.25)',2,2);pass(23,'#8f7650',0,0);pass(17,'#4b3a26',0,0);pass(11,'#2f4a4c',0,.6);pass(3,'rgba(160,200,200,.16)',-1.5,-1);

const TR_NEAR={wall:1,wall2:1,keep:1,keep2:1,fence:1,tower:1,shrine:1};

/* ---------- spatial grid ---------- */
const CS=24;let SGC,SGR,grid,FW,FH,FV;const FC=16;
let gridS=[[],[]],bgrid=[];
function resetGrid(){SGC=Math.ceil(W/CS);SGR=Math.ceil(H/CS);grid=[];gridS=[[],[]];bgrid=[];for(let i=0;i<SGC*SGR;i++){grid.push([]);gridS[0].push([]);gridS[1].push([]);bgrid.push([]);}FW=Math.ceil(W/FC);FH=Math.ceil(H/FC);FV=new Uint8Array(FW*FH);}
function buildGrid(){for(let i=0;i<grid.length;i++){grid[i].length=0;gridS[0][i].length=0;gridS[1][i].length=0;bgrid[i].length=0;}
  for(const e of S.ents){const i=clamp(e.y/CS|0,0,SGR-1)*SGC+clamp(e.x/CS|0,0,SGC-1);grid[i].push(e);gridS[e.side][i].push(e);if(e.k.build)bgrid[i].push(e);}}
function queryG(G,x,y,r,fn){
  const x0=Math.max(0,Math.floor((x-r)/CS)),x1=Math.min(SGC-1,Math.floor((x+r)/CS)),y0=Math.max(0,Math.floor((y-r)/CS)),y1=Math.min(SGR-1,Math.floor((y+r)/CS));
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const c=G[cy*SGC+cx];for(let i=0;i<c.length;i++)fn(c[i]);}
}
function query(x,y,r,fn){
  const x0=Math.max(0,Math.floor((x-r)/CS)),x1=Math.min(SGC-1,Math.floor((x+r)/CS)),y0=Math.max(0,Math.floor((y-r)/CS)),y1=Math.min(SGR-1,Math.floor((y+r)/CS));
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const c=grid[cy*SGC+cx];for(let i=0;i<c.length;i++)fn(c[i]);}
}
function gap(a,o){const dx=o.k.hw?Math.max(Math.abs(a.x-o.x)-o.k.hw,0):a.x-o.x;return Math.hypot(dx,a.y-o.y)-o.r;}
function findTarget(u,rad,bOnly){
  const c=[],G=bOnly?bgrid:gridS[1-u.side],R=rad+34,ux=u.x/CS|0,uy=u.y/CS|0,KR=Math.ceil(R/CS)+1;
  const test=o=>{
    if(o.side===u.side||o.hp<=0||o.k.pit)return;
    if(bOnly&&!o.k.build)return;
    if(o.k.ship&&!u.k.ranged)return;// only arrows (and other ships) reach a ship
    if(u.k.ship&&!o.k.build&&!o.k.ship&&!u.k.ranged)return;
    let d=gap(u,o);if(d>rad)return;if(o.k.hw)d+=12;
    if(o.k.ninja&&(d>40||forest[cellOf(o.x,o.y)]))return;
    if(u.side===0&&FOG&&!o.k.build&&!visAt(o.x,o.y))return;
    if(c.length<4){c.push([d,o]);c.sort((a,b)=>a[0]-b[0]);}
    else if(d<c[3][0]){c[3]=[d,o];c.sort((a,b)=>a[0]-b[0]);}
  };
  for(let ring=0;ring<=KR;ring++){

      for(let dx=-ring;dx<=ring;dx+=(edge||ring===0)?1:2*ring){const cx=ux+dx;if(cx<0||cx>=SGC)continue;const L=G[cy*SGC+cx];for(let q=0;q<L.length;q++)test(L[q]);}}

/* ---------- combat ---------- */

    if(!t.k.build&&Math.random()<.3&&S.fx.length<400)S.fx.push({ty:'spark',x:(u.x*.4+t.x*.6),y:(u.y*.4+t.y*.6),life:.25,max:.25,a:Math.random()*6.3,h:Math.random()});}

const WALL_BOW=105;

/* ---------- movement & update ---------- */
function moveStep(u,dx,dy,dt){

function updEnt(u,dt){
  const k=u.k;u.cdT-=dt;u.rt-=dt;
  if(k.pit){
    if(u.full||u.rt>0)return;u.rt=.15;
    query(u.x,u.y,14,o=>{if(u.full||o.side===u.side||o.k.build||o.trap>0||o.k.ninja)return;
      if(Math.hypot(o.x-u.x,o.y-u.y)<10){o.trap=12+Math.random()*7;o.tg=null;o.x=u.x+(Math.random()-.5)*7;o.y=u.y+(Math.random()-.5)*4;u.n=(u.n||0)+1;
        S.fx.push({ty:'dust',x:u.x,y:u.y,life:.8,max:.8});if(u.n>=7)u.full=1;}});
    return;
  }
  if(k.build){

    return;
  }
  if(u.boardOn){const s=u.boardOn;
    if(s.hp<=0)u.boardOn=null;
    else if(Math.hypot(s.x-u.x,s.y-u.y)<s.r+26){if(cargoN(s)<s.k.cap&&aboardN(u.side)<navalCap(u.side)){(s.cargo||(s.cargo=[])).push(u);u.boarded=1;u.boardOn=null;S.boardDirty=1;return;}
      u.boardOn=null;u.st='hold';u.ax=u.x;u.ay=u.y;if(u.side===0&&S.t-(S.fullMsg||-9)>3){S.fullMsg=S.t;toast(cargoN(s)>=s.k.cap?TT('船がいっぱいです（'+s.k.cap+'人まで）','The ship is full ('+s.k.cap+' max)'):TT('船に乗れるのは全部で'+navalCap(u.side)+'人までです（造船所があれば1000人）','Up to '+navalCap(u.side)+' troops can be at sea (1000 with a shipyard)'));}}
    else if(u.st!=='move'){u.st='move';u.ax=s.x;u.ay=s.y;u.gx=s.x;u.gy=s.y;u.fld=fieldTo(s.x,s.y);}}
  if(k.ship&&u.unload&&cargoN(u)&&(u.st!=='move'||Math.hypot(u.unload.x-u.x,u.unload.y-u.y)<u.r+70)&&(u.unloadT=(u.unloadT||0)-dt)<=0){u.unloadT=.4;
    if(!disembark(u)&&u.st!=='move'){u.unload=null;if(u.side===0)toast(TT('近くに上陸できる陸地がありません','No land close enough to go ashore'));}}
  if(u.chargeT>0)u.chargeT-=dt;
  if(u.trap>0){u.trap-=dt;u.mv=0;u.inR=0;return;}
  if(k.ninja){ninjaScout(u,dt);}
  let st=u.st;
  if(S.phase!=='battle'&&st!=='move'&&st!=='gen')st='hold';
  const G=st==='gen'&&u.lord&&u.lord.hp>0?u.lord:null;if(st==='gen'&&!G){u.st=st='hold';u.ax=u.x;u.ay=u.y;u.lord=null;}
  const gax=G?G.x+u.gox:0,gay=G?G.y+u.goy:0;
  if(u.rt<=0){u.rt=.25+Math.random()*.15;

  let t=u.tg;
  if(t&&t.hp<=0)t=u.tg=null;
  if(t&&st==='hold'&&Math.hypot(t.x-u.ax,t.y-u.ay)>130)t=u.tg=null;
  if(t&&G&&Math.hypot(t.x-gax,t.y-gay)>(G.cmd==='atk'?240:130))t=u.tg=null;
  let dir=null;u.inR=0;
  if(k.eng&&S.phase==='battle'&&u.side===1&&!(t&&gap(u,t)<=k.rng)){
    let best=null,bd=18;for(const tr of S.trenches){const d=Math.hypot(tr.x-u.x,tr.y-u.y);if(d<bd){bd=d;best=tr;}}
    if(best){best.hp-=dt*7;u.inR=1;u.atk=S.t-(S.t%1<.5?0:1);if(Math.random()<.05)S.fx.push({ty:'dust',x:best.x,y:best.y,life:.6,max:.6});
      if(best.hp<=0){fillTrench(best);if(best.x&&nearCam(best.x,best.y))toast(TT('敵の工兵に堀を埋められた！','Enemy sappers filled in a moat!'));}u.mv=0;return;}
  }
  if(t&&u.inWall&&st==='hold'&&gap(u,t)>k.rng+3&&gap(u,t)<=WALL_BOW){// shoot from behind the wall instead of leaving it
    u.inR=1;u.ang=Math.atan2(t.y-u.y,t.x-u.x);if(u.cdT<=0){wallShot(u,t);u.cdT=1.6*(.9+Math.random()*.2);}t=null;}
  else if(t){
    const dx=t.x-u.x,dy=t.y-u.y,dd=Math.hypot(dx,dy)||1;
    const g=gap(u,t);
    if(g<=effRange(u,t)&&!(k.minr&&g<k.minr)){
      u.inR=1;u.ang=Math.atan2(dy,dx);
      if(u.cdT<=0){attack(u,t);u.cdT=k.cd*(.9+Math.random()*.2);}
    }else if(!(k.minr&&g<k.minr))dir=[dx/dd,dy/dd];
  }else if(G){// follow the general, keeping your place in his formation
    const dx=gax-u.x,dy=gay-u.y,dd=Math.hypot(dx,dy);
    if(dd>70&&G.fld&&G.st==='move')dir=fieldDir(G.fld,u)||[dx/dd,dy/dd];
    else if(dd>60&&!los(u.x,u.y,gax,gay)){const f=fieldTo(gax,gay);dir=(f&&fieldDir(f,u))||[dx/dd,dy/dd];}
    else if(dd>4)dir=[dx/dd,dy/dd];
  }else if(st==='adv'){
    dir=fieldDir(k.ship?shipAdvField():S.fhq[u.side],u);
  }else if(st==='move'){
    const dx=u.ax-u.x,dy=u.ay-u.y,dd=Math.hypot(dx,dy);
    if(dd<9)arrive(u);
    else if(dd<26&&(k.ship||los(u.x,u.y,u.ax,u.ay)))dir=[dx/dd,dy/dd];
    else dir=(u.fld&&fieldDir(u.fld,u))||[dx/dd,dy/dd];
  }else{
    const dx=u.ax-u.x,dy=u.ay-u.y,dd=Math.hypot(dx,dy);
    if(dd>3)dir=[dx/dd,dy/dd];
  }
  if(dir){moveStep(u,dir[0],dir[1],dt);u.mv=1;}else u.mv=0;
  const c=Math.cos(u.ang);if(c>.3)u.f=1;else if(c<-.3)u.f=-1;
  const px=u.x,py=u.y;
  queryG(bgrid,u.x,u.y,u.r+28,o=>{
    if(o.k.pit)return;
    if(o.k.hw){
      if(o.side===u.side)return;
      const qx=clamp(u.x,o.x-o.k.hw,o.x+o.k.hw),dx=u.x-qx,dy=u.y-o.y,rr=u.r+o.r,d2=dx*dx+dy*dy;
      if(d2<rr*rr){const dd=Math.sqrt(d2)||.01;const nx=d2>1e-4?dx/dd:0,ny=d2>1e-4?dy/dd:(u.side===0?1:-1);u.x+=nx*(rr-dd);u.y+=ny*(rr-dd);}
      return;
    }
    const dx=u.x-o.x,dy=u.y-o.y,rr=u.r+o.r,d2=dx*dx+dy*dy;
    if(d2<rr*rr&&d2>1e-4){const dd=Math.sqrt(d2),p=(rr-dd)/dd*(o.k.build?1:.5);u.x+=dx*p;u.y+=dy*p;}
  });
  queryG(grid,u.x,u.y,u.r+7,o=>{
    if(o===u||o.k.build)return;
    const dx=u.x-o.x,dy=u.y-o.y,rr=u.r+o.r,d2=dx*dx+dy*dy;
    if(d2<rr*rr&&d2>1e-4){const dd=Math.sqrt(d2),p=(rr-dd)/dd*.5;u.x+=dx*p;u.y+=dy*p;}
  });
  u.x=clamp(u.x,3,W-3);u.y=clamp(u.y,3,H-3);
  if(!passU(u,u.x,u.y)&&passU(u,px,py)){u.x=px;u.y=py;}
}

/* ---------- forts (砦) ---------- */
let fortT=0;
function updForts(dt){
  fortT-=dt;if(fortT>0)return;fortT=.5;
  for(const f of S.forts){
    let a=0,b=0;
    query(f.x,f.y,70,o=>{if(o.k.build||o.hp<=0||o.k.ninja)return;if(Math.hypot(o.x-f.x,o.y-f.y)<70){if(o.side===0)a++;else b++;}});
    if(a&&!b)f.p=Math.max(-1,f.p-.06*Math.min(a,12)/6);
    else if(b&&!a)f.p=Math.min(1,f.p+.06*Math.min(b,12)/6);
    const own=f.p<=-.999?0:f.p>=.999?1:-1;
    if(own!==f.own){
      const prev=f.own;f.own=own;
      if(own===0){toast(TT('砦を奪った！ MP回復 +3/秒','Fort captured! MP +3/s'));SFX.drums();}
      else if(own===1){toast(TT('砦を敵に奪われた','The enemy took a fort'));}
      else if(prev===0)toast(TT('砦が中立に戻った','A fort is neutral again'));
      renderFortChips();
    }
  }
}
function fortBonus(side){let n=0;for(const f of S.forts)if(f.own===side)n+=3;for(const e of S.ents)if(e.side===side&&e.k.mp)n+=e.k.mp;return n;}

function step(dt){
  S.t+=dt;
  for(let s=0;s<2;s++)S.mp[s]=Math.min(MPMAX,S.mp[s]+(S.reg[s]+fortBonus(s))*dt);
  if(S.phase==='build'){if(S.tut<0)S.buildLeft-=dt;if(S.buildLeft<=0)startBattle();}
  else S.battleT+=dt;
  buildGrid();
  S.fogT-=dt;if(S.fogT<=0){S.fogT=.3;computeFog();}
  if(S.fieldsDirty){S.fieldsDirty=0;rebuildHQFields();for(const e of S.ents)if(e.st==='move'&&e.fld&&!e.k.build)e.fld=e.k.ship?fieldToW(e.gx??e.ax,e.gy??e.ay):fieldTo(e.gx??e.ax,e.gy??e.ay);}
  if(S.intel.length&&S.t-S.intel[0].t>70)S.intel=S.intel.filter(i=>S.t-i.t<=70);
  ai(dt);
  S.flT-=dt;if(S.flT<=0){S.flT=.4;computeFlanks();S.shr=[0,0];for(const e of S.ents)if(e.k.shrine&&e.hp>0)S.shr[e.side]=Math.min(3,S.shr[e.side]+1);}
  updGenerals(dt);
  if(S.phase==='battle')updForts(dt);
  const es=S.ents;
  for(let i=0;i<es.length;i++)updEnt(es[i],dt);
  if(S.boardDirty){S.boardDirty=0;S.ents=S.ents.filter(e=>!e.boarded);if(S.sel.length)S.sel=S.sel.filter(e=>!e.boarded);}
  for(let i=S.proj.length-1;i>=0;i--){
    const p=S.proj[i];p.t+=dt;
    if(p.t>=p.T){const g=p.tg;if(g.hp>0&&Math.hypot(g.x-p.tx,g.y-p.ty+3)<g.r+(g.k.hw||0)+8)hit(g,p.d,p.pin,p.src);if(p.stone){S.fx.push({ty:'dust',x:p.tx,y:p.ty,life:.9,max:.9,big:1});if(nearCam(p.tx,p.ty))SFX.thud();}S.proj.splice(i,1);}
  }
  let dead=false;
  for(const e of S.ents)if(e.hp<=0){dead=true;
    if(e.cargo&&e.cargo.length){if(e.side===0)S.losses+=e.cargo.length;else S.kills+=e.cargo.length;e.cargo=[];if(e.side===0)toast(TT('船が沈んだ… 乗っていた兵も失われた','A ship went down, with the troops aboard'));}
    if(e.k.gen){for(const u of es)if(u.lord===e){u.lord=null;if(u.st==='gen'){u.st='hold';u.ax=u.x;u.ay=u.y;}}if(e.side===0){toast(TT('将軍が討たれた！ 配下の兵はその場で踏みとどまる','Your general has fallen! His men hold their ground'));SFX.fall();}}
    if(!e.k.build){S.marks.push({x:e.x,y:e.y,side:e.side,kind:e.kind,f:e.f,life:14});if(e.side===1)S.kills++;else S.losses++;}
    else{S.fx.push({ty:'ring',x:e.x,y:e.y,life:.8,max:.8,big:1});markBuilding(e,false);if(nearCam(e.x,e.y))SFX.fall();}
  }
  if(dead){S.ents=S.ents.filter(e=>e.hp>0);if(S.sel.length)S.sel=S.sel.filter(e=>e.hp>0);}
  if(S.marks.length>700)S.marks.splice(0,S.marks.length-700);
  for(let i=S.marks.length-1;i>=0;i--){S.marks[i].life-=dt;if(S.marks[i].life<=0)S.marks.splice(i,1);}
  for(let i=S.fx.length-1;i>=0;i--){const f=S.fx[i];f.life-=dt;if(f.ty==='text')f.y-=12*dt;if(f.life<=0)S.fx.splice(i,1);}
  if(!S.over&&S.hq[1].hp<=0){const rest=(S.ehq||[]).filter(e=>e.hp>0);
    if(rest.length){S.hq[1]=rest[0];HQP[1]={x:rest[0].x,y:rest[0].y};rebuildHQFields();toast(TT('敵の本陣を一つ落とした！ もう一つの本陣へ','One enemy HQ has fallen! On to the other'));SFX.drums();}}
  if(!S.over){if(S.hq[1].hp<=0)endGame(true);else if(S.hq[0].hp<=0)endGame(false);}
}
function startBattle(){
  S.phase='battle';S.buildLeft=0;
  for(const e of S.ents){
    if(e.k.build)continue;
    if(e.side===0){if(e.st!=='move'){e.st='hold';e.ax=e.x;e.ay=e.y;}}
    else{e.st='hold';if(!e.guard){e.ax=e.x;e.ay=e.y;}}
  }
  if(S.tut<0)aiSendToForts(.45);
  S.fx.push({ty:'banner',txt:TT('決 戦','BATTLE'),life:1.6,max:1.6});SFX.horn();
  updateButtons();
}

/* ---------- enemy AI ---------- */
function bestSpot(n,y0,y1,high){
  let bx=0,by=0,bv=-1;
  for(let i=0;i<n;i++){const x=30+Math.random()*(W-60),y=y0+Math.random()*(y1-y0);if(!passable(x,y))continue;const v=(high?elev(x,y):0)+Math.random()*.25;if(v>bv){bv=v;bx=x;by=y;}}
  if(bv<0){bx=HQP[1].x+(Math.random()-.5)*300;by=y0+(y1-y0)/2;}
  if(y1<y0)by=y0;
  return[bx,by];
}
function pickKind(){
  const c={sword:0,spear:0,archer:0,cav:0};
  for(const e of S.ents)if(e.side===0&&c[e.kind]!==undefined)c[e.kind]++;
  const w={sword:3+c.spear/12,spear:2.5+c.cav/8,archer:2.5+c.sword/12,cav:1.8+c.archer/9};
  if(S.level>=lvOf('hcav'))w.hcav=1.2+c.sword/20;
  if(S.eStyle==='ainu'){delete w.cav;delete w.hcav;w.archer+=1.2;}// the Ainu fight on foot, with bows
  if(S.phase==='battle'){let ob=S.trenches.length/6;for(const e of S.ents)if(e.side===0&&(e.k.hw||e.kind==='tower'||e.kind==='keep'))ob+=.25;w.eng=.3+Math.min(3,ob);}
  let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot;
  for(const k in w){r-=w[k];if(r<=0)return k;}return'sword';
}
function aiFlank(units){
  // spread an enemy advance over several river crossings instead of one bridge
  const bySq=new Map();for(const u of units){if(!bySq.has(u.sq))bySq.set(u.sq,[]);bySq.get(u.sq).push(u);}
  for(const[,us]of bySq){
    if(!WORLD.cross.length||Math.random()<.35){for(const u of us)u.st='adv';continue;}
    const c=WORLD.cross[Math.random()*WORLD.cross.length|0],tx=c.x+(Math.random()-.5)*20,ty=c.y+70;
    const fl=fieldTo(tx,ty);if(!fl){for(const u of us)u.st='adv';continue;}
    for(const u of us){u.st='move';u.then='adv';u.fld=fl;u.gx=tx;u.gy=ty;u.ax=tx+(Math.random()-.5)*40;u.ay=ty+(Math.random()-.5)*30;}
  }
}
function aiSendToForts(frac){
  const targets=S.forts.filter(f=>f.own!==1).sort((a,b)=>a.y-b.y);
  if(!targets.length)return;
  const bySq=new Map();
  for(const e of S.ents)if(e.side===1&&!e.k.build&&!e.guard&&(e.st==='hold'||e.st==='adv')){if(!bySq.has(e.sq))bySq.set(e.sq,[]);bySq.get(e.sq).push(e);}
  let i=0;
  for(const[,us]of bySq){if(Math.random()>frac)continue;const f=targets[i++%Math.min(2,targets.length)];const fl=fieldTo(f.x,f.y);
    for(const u of us){u.st='move';u.fld=fl;u.gx=f.x;u.gy=f.y;u.ax=f.x+(Math.random()-.5)*60;u.ay=f.y+(Math.random()-.5)*60;}}
}
/* ---------- 将軍: commands the soldiers around him ---------- */
const GEN_R=170,GEN_MAX=3;
function retinue(g){return S.ents.filter(u=>u.lord===g&&u.hp>0);}
function assignRetinue(g){
  let n=0;
  for(const u of S.ents){if(u.side!==g.side||u.k.build||u.k.gen||u.hp<=0)continue;
    if(u.lord&&u.lord!==g&&u.lord.hp>0)continue;
    const dx=u.x-g.x,dy=u.y-g.y,d=Math.hypot(dx,dy);if(u.lord!==g&&d>GEN_R)continue;
    const s=d>100?100/d:1;u.lord=g;u.gox=dx*s;u.goy=dy*s;u.st='gen';u.tg=null;n++;}
  g.ret0=Math.max(g.ret0||0,n);return n;
}
function setGenCmd(gs,cmd){
  let tot=0;
  for(const g of gs){if(!g.k.gen||g.hp<=0)continue;g.cmd=cmd;g.ret0=0;tot+=assignRetinue(g);g.aiT=0;
    if(cmd==='hold'){g.st='hold';g.ax=g.x;g.ay=g.y;}}
  return tot;
}
function updGenerals(dt){
  for(const g of S.ents){
    if(!g.k.gen||g.hp<=0||g.side!==0)continue;
    g.aiT=(g.aiT||0)-dt;if(g.aiT>0)continue;g.aiT=.6;
    const R=retinue(g);g.retN=R.length;
    // soldiers newly deployed right beside the general join him
    for(const u of S.ents)if(u.side===0&&!u.lord&&!u.k.build&&!u.k.gen&&u.st==='hold'&&Math.abs(u.x-g.x)<60&&Math.abs(u.y-g.y)<60&&Math.hypot(u.x-g.x,u.y-g.y)<60){u.lord=g;u.gox=u.x-g.x;u.goy=u.y-g.y;u.st='gen';g.retN++;}
    if(g.cmd!=='atk'||S.phase!=='battle')continue;
    if(g.userMove&&g.st==='move')continue;g.userMove=0;
    if(g.ret0>=10&&R.length<g.ret0*.25){g.cmd='hold';const h=HQP[0];g.st='move';g.then='hold';g.ax=g.gx=h.x+(Math.random()-.5)*120;g.ay=g.gy=h.y-110;g.fld=fieldTo(g.ax,g.ay);
      toast(TT('配下が減ったため、将軍が退却して守りに入る','Too few men left — the general falls back to defend'));continue;}
    // wait for stragglers
    let lag=0;for(const u of R)lag+=Math.hypot(u.x-(g.x+u.gox),u.y-(g.y+u.goy));lag=R.length?lag/R.length:0;
    if(lag>95){g.st='hold';g.ax=g.x;g.ay=g.y;continue;}
    g.pickT=(g.pickT||0)-.6;if(g.pickT>0&&g.st==='move')continue;g.pickT=3;
    // nearest enemy force in reach, else the nearest fort not ours, else the enemy camp
    let best=null,bd=750;
    const agg=new Map();for(const e of S.ents){if(e.side!==1||e.k.build||e.hp<=0||e.sq==null)continue;if(FOG&&!visAt(e.x,e.y))continue;let a=agg.get(e.sq);if(!a){a={x:0,y:0,n:0};agg.set(e.sq,a);}a.x+=e.x;a.y+=e.y;a.n++;}
    for(const a of agg.values()){const x=a.x/a.n,y=a.y/a.n,d=Math.hypot(x-g.x,y-g.y);if(d<bd){bd=d;best={x,y};}}
    if(!best){let fd=1600;for(const f of S.forts)if(f.own!==0){const d=Math.hypot(f.x-g.x,f.y-g.y);if(d<fd){fd=d;best={x:f.x,y:f.y};}}}
    if(!best)best={x:HQP[1].x,y:HQP[1].y+60};
    const dx=best.x-g.x,dy=best.y-g.y,d=Math.hypot(dx,dy)||1,st=Math.max(0,d-35);
    const tx=g.x+dx/d*st,ty=g.y+dy/d*st;
    g.st='move';g.then='hold';g.ax=g.gx=tx;g.ay=g.gy=ty;g.fld=fieldTo(tx,ty);
  }
}
const FLANK_R=150;
// soldiers standing right behind their own palisade or wall cannot be caught in a pincer
function behindWall(x,y,side){let hit=false;queryG(bgrid,x,y,40,o=>{if(hit||o.side!==side||o.hp<=0||!o.k.hw)return;if(Math.abs(o.x-x)<=o.k.hw+10&&Math.abs(o.y-y)<26)hit=true;});return hit;}
function computeFlanks(){
  // a squad is caught in a pincer when enemy squads stand on opposite sides of it (within FLANK_R)
  const agg=new Map();
  for(const e of S.ents){if(e.k.build||e.hp<=0||e.sq==null||e.trap>0)continue;let a=agg.get(e.sq);if(!a){a={x:0,y:0,n:0,side:e.side,id:e.sq};agg.set(e.sq,a);}a.x+=e.x;a.y+=e.y;a.n++;}
  const L=[[],[]];for(const a of agg.values()){a.x/=a.n;a.y/=a.n;L[a.side].push(a);}
  S.flankPts=[];
  if(S.phase!=='battle')return;
  const R2=FLANK_R*FLANK_R;
  for(const s of[0,1])for(const t of L[s]){
    const dirs=[];for(const a of L[1-s]){const dx=a.x-t.x,dy=a.y-t.y,d2=dx*dx+dy*dy;if(d2<R2&&d2>1)dirs.push(Math.atan2(dy,dx));}
    if(dirs.length<2)continue;
    let ok=false;for(let i=0;i<dirs.length&&!ok;i++)for(let j=i+1;j<dirs.length;j++){let da=Math.abs(dirs[i]-dirs[j]);if(da>Math.PI)da=2*Math.PI-da;if(da>1.92){ok=true;break;}}
    if(ok&&!behindWall(t.x,t.y,s)){S.flank.set(t.id,S.t+1);S.flankPts.push({x:t.x,y:t.y,side:s});}
  }
}
function guardResponse(dt){
  // the camp garrison rushes to intruders near the enemy HQ, then goes back to its posts
  S.thT-=dt;if(S.thT>0)return;S.thT=.8;
  const R=MODE==='local'?170:400;let th=null,bd=1e9,h=HQP[1];
  for(const c of(S.ehq||[S.hq[1]])){if(c.hp<=0)continue;queryG(gridS[0],c.x,c.y,R,o=>{if(o.k.build||o.hp<=0)return;const d=Math.hypot(o.x-c.x,o.y-c.y);if(d<R&&d<bd){bd=d;th=o;h=c;}});}
  if(th){
    if(!S.alarm&&th.side===0&&nearCam(h.x,h.y))toast(TT('敵の守備隊が迎え撃ってくる！','The enemy garrison sallies out!'));
    S.alarm=S.t;const fl=fieldTo(th.x,th.y);
    for(const u of S.ents){if(u.side!==1||!u.guard||u.k.build)continue;if(u.resp&&S.t-u.resp<3)continue;
      u.st='move';u.then='hold';u.ax=th.x+(Math.random()-.5)*40;u.ay=th.y+(Math.random()-.5)*40;u.gx=th.x;u.gy=th.y;u.fld=fl;u.resp=S.t;u.tg=null;}
  }else if(S.alarm&&S.t-S.alarm>6){S.alarm=0;
    for(const u of S.ents){if(u.side!==1||!u.guard||u.k.build||!u.home)continue;u.st='move';u.then='hold';u.ax=u.home.x;u.ay=u.home.y;u.gx=u.home.x;u.gy=u.home.y;u.fld=fieldTo(u.home.x,u.home.y);u.resp=0;}}
}
function ai(dt){
  if(S.phase==='battle'&&S.tut>=0)return;
  if(S.phase==='battle')guardResponse(dt);
  if(S.phase==='battle'){S.waveT-=dt;if(S.waveT<=0){
    S.waveT=26+Math.random()*10;let n=0;
    aiSendToForts(.35);
    let go=S.ents.filter(e=>e.side===1&&!e.k.build&&e.st==='hold'&&!e.guard);
    // early 陣: the enemy comes in two smaller waves instead of one big mass
    if(S.level<=3&&go.length>16){const sq=new Map();for(const u of go){if(!sq.has(u.sq))sq.set(u.sq,[]);sq.get(u.sq).push(u);}const half=Math.ceil(go.length*.55);go=[];for(const[,us]of sq){if(go.length>=half)break;go.push(...us);}S.waveT=18+Math.random()*6;}
    n=go.length;aiFlank(go);
    if(n>=8){S.wave++;SFX.drums();if(FOG)toast(TT('遠くで太鼓が鳴った…敵が動き出した','War drums in the distance… the enemy is moving'));else toast(TT('敵の第'+S.wave+'陣、'+n+'人が進軍してくる！','Enemy wave '+S.wave+': '+n+' men advancing!'));}
  }}
  S.eT-=dt;if(S.eT>0)return;
  const build=S.phase==='build';
  S.eT=build?.85:1.25+Math.random()*.9;
  if(Math.random()<(build?.55:.3)&&enemyBuildStep())return;
  // keep MP back for the next planned defence instead of spending it all on soldiers
  if(S.ePlan&&S.ePlan.length&&S.mp[1]<K[S.ePlan[0].kind].cost+40&&Math.random()<(build?.7:.3)){S.eT=.5;return;}
  const towersNow=S.ents.filter(e=>e.side===1&&e.kind==='tower').length;
  const r=Math.random();
  if(!build&&r<.06&&S.mp[1]>=K.tower.cost&&towersNow<S.aiTowers+4){
    const fw=S.ents.filter(e=>e.side===1&&!e.k.build&&!e.guard&&e.y>EZ+40&&e.y<PZ-40);
    if(fw.length){const u=fw[Math.random()*fw.length|0];const x=u.x+(Math.random()-.5)*20,y=u.y-12;
      if(canBuild(1,x,y)){spawn(1,'tower',x,y);S.mp[1]-=K.tower.cost;return;}}
  }
  let kind;
  if(!build&&r<.04&&towersNow<S.aiTowers+1&&!(S.ePlan&&S.ePlan.length))kind='tower';
  else kind=pickKind();
  const k=K[kind],need=k.cost;
  if(S.mp[1]<need){S.eT=.4;return;}
  let x,y;
  const asGuard=!k.build&&kind!=='eng'&&guardShare()<guardTarget();
  if(asGuard)[x,y]=guardSpot();
  else if(kind==='tower')[x,y]=bestSpot(16,EZ0+60,EZ-24,true);
  else if(kind==='archer')[x,y]=bestSpot(10,EZ0+60,EZ-30,true);
  else [x,y]=bestSpot(5,EZ0+(build?90:200)*(MODE==='local'?.5:1),EZ-30,Math.random()<.5);
  if(spawn(1,kind,x,y)){S.mp[1]-=need;if(asGuard)markGuard(SQID-1,[x,y]);}else S.eT=1.5;
}

/* ---------- fog of war (large mode) ---------- */
const VIS={tower:230,wall:150,wall2:200,keep:300,keep2:360,hq:280};
function computeFog(){
  if(!FOG){return;}
  FV.fill(0);
  const mark=(x,y,r)=>{const cx=x/FC,cy=y/FC,rr=r/FC,x0=Math.max(0,Math.floor(cx-rr)),x1=Math.min(FW-1,Math.ceil(cx+rr)),y0=Math.max(0,Math.floor(cy-rr)),y1=Math.min(FH-1,Math.ceil(cy+rr)),r2=rr*rr;
    for(let j=y0;j<=y1;j++){const dy=j+.5-cy;for(let i=x0;i<=x1;i++){const dx=i+.5-cx;if(dx*dx+dy*dy<=r2)FV[j*FW+i]=1;}}};
  for(const e of S.ents){if(e.side!==0||e.k.pit||e.k.ninja)continue;if(e.k.build){const r=VIS[e.kind]||120;mark(e.x,e.y,r);}else mark(e.x,e.y,e.k.horse?190:170);}
  for(const f of S.forts)if(f.own===0)mark(f.x,f.y,210);
  for(const e of S.ents)if(e.side===1&&e.k.build&&!e.seen&&FV[clamp(e.y/FC|0,0,FH-1)*FW+clamp(e.x/FC|0,0,FW-1)])e.seen=1;
  fogImg();
}
function visAt(x,y){return!FOG||FV[clamp(y/FC|0,0,FH-1)*FW+clamp(x/FC|0,0,FW-1)]===1;}
/* ---------- fortification upgrades: 柵 → 砦 → 城 ---------- */
function upgradeAt(x,y){
  let best=null,bd=26;
  const UPN={fence:'wall',wall:'wall2',tower:'keep',keep:'keep2',ship:'ship2',ship2:'ship3',ship3:'ship4',dock:'yard'};
  for(const e of S.ents){if(e.side!==0||!UPN[e.kind])continue;const d=Math.hypot(e.x-x,e.y-y)-(e.k.ship?e.r:0);if(d<bd){bd=d;best=e;}}
  if(!best)return'none';
  if(best.k.ship){if(UPN[best.kind]==='ship4'){if(!ownYardNear(best.x,best.y,150))return'yard';}else if(!ownDockNear(best.x,best.y,110))return'dock';}
  const nk=UPN[best.kind],k=K[nk];
  if(S.mp[0]<k.cost)return'mp:'+k.cost;
  S.mp[0]-=k.cost;
  best.kind=nk;best.k=k;best.hp=best.maxhp=k.hp;best.r=k.r;best.cdT=0;if(k.ship){const s=S.squads.get(best.sq);if(s)s.kind=nk;}else markBuilding(best,true);
  S.fx.push({ty:'ring',x:best.x,y:best.y,life:.9,max:.9});
  return nk;
}

/* ---------- big buildings block paths so soldiers walk around them ---------- */
const BLOCKS={tower:1,keep:1,keep2:1,shrine:1};
function markBuilding(e,on){
  if(!BLOCKS[e.kind])return;
  const r=e.r-1.5,c0x=e.x/CELL|0,c0y=e.y/CELL|0,rr=Math.ceil(r/CELL)+1;
  for(let dy=-rr;dy<=rr;dy++)for(let dx=-rr;dx<=rr;dx++){const cx=c0x+dx,cy=c0y+dy;if(cx<0||cy<0||cx>=GW||cy>=GH)continue;
    if(Math.hypot((cx+.5)*CELL-e.x,(cy+.5)*CELL-e.y)>r)continue;const c=cy*GW+cx;
    if(on&&blk[c]===0)blk[c]=4;else if(!on&&blk[c]===4)blk[c]=0;}
  S.fieldsDirty=1;
}

/* ---------- mid-battle save: a long 全国戦 can be closed and resumed ---------- */
const MIDKEY='yaji-v3-mid';
const EF=['sm','dm','id','side','kind','x','y','hp','maxhp','m','st','ax','ay','gx','gy','sq','guard','then','trap','full','n','seen','chargeT','gox','goy','cmd','ret0','f','vet','army'];
function snapshot(){
  const r=v=>typeof v==='number'?Math.round(v*10)/10:v;
  const ents=S.ents.filter(e=>e.hp>0).map(e=>{const o={};for(const k of EF)if(e[k]!=null)o[k]=r(e[k]);if(e.home)o.home=[r(e.home.x),r(e.home.y)];if(e.lord)o.lord=e.lord.id;if(e.cargo&&e.cargo.length)o.cargo=e.cargo.map(c=>({kind:c.kind,sq:c.sq,hp:r(c.hp),maxhp:c.maxhp,vet:c.vet,army:c.army}));return o;});
  return{v:1,mode:MODE,level:S.level,t:r(S.t),phase:S.phase,buildLeft:S.buildLeft,battleT:S.battleT,mp:S.mp.map(r),waveT:S.waveT,wave:S.wave,
    kills:S.kills,losses:S.losses,pincers:S.pincers,speed:S.speed,forts:S.forts.map(f=>[f.p,f.own]),
    trenches:S.trenches.map(t=>[r(t.x),r(t.y),t.l,t.hp]),squads:[...S.squads.values()].map(q=>[q.id,q.side,q.kind]),nid:NID,sqid:SQID,ents};
}
function saveMid(){if(!S||S.over||S.tut>=0||S.replay!=null)return;try{localStorage.setItem(MIDKEY,JSON.stringify(snapshot()));}catch(e){}}
function loadMid(){try{return JSON.parse(localStorage.getItem(MIDKEY)||'null');}catch(e){return null;}}
function clearMid(){try{localStorage.removeItem(MIDKEY);}catch(e){}}
function restoreSnapshot(sn){
  // newGame() has already built the map; replace its opening state with the saved one
  for(const e of S.ents)if(e.k.build)markBuilding(e,false);
  S.ents=[];S.trenches=[];TR.fill(0);S.squads.clear();
  Object.assign(S,{t:sn.t,phase:sn.phase,buildLeft:sn.buildLeft,battleT:sn.battleT,mp:sn.mp,waveT:sn.waveT,wave:sn.wave,kills:sn.kills,losses:sn.losses,pincers:sn.pincers,speed:sn.speed||1});
  sn.forts.forEach((f,i)=>{if(S.forts[i]){S.forts[i].p=f[0];S.forts[i].own=f[1];}});
  for(const q of sn.squads)S.squads.set(q[0],{id:q[0],side:q[1],kind:q[2]});
  const byId=new Map();
  for(const o of sn.ents){if(!K[o.kind]||(!K[o.kind].build&&!UNITK.includes(o.kind)&&!K[o.kind].ship))continue;const e=mk(o.side,o.kind,o.x,o.y);Object.assign(e,o);e.k=K[o.kind];e.r=e.k.r;if(o.home)e.home={x:o.home[0],y:o.home[1]};e.lord=null;byId.set(e.id,[e,o]);
    if(e.k.build)markBuilding(e,true);if(e.kind==='hq'&&e.side===0)S.hq[0]=e;
    if(o.cargo){delete e.cargo;e.cargo=o.cargo.map(c=>{const u=mk(e.side,c.kind,e.x,e.y);S.ents.pop();Object.assign(u,{sq:c.sq,hp:c.hp,maxhp:c.maxhp||u.maxhp,vet:c.vet,army:c.army,st:'hold',boarded:1});return u;});}}
  S.ehq=S.ents.filter(e=>e.kind==='hq'&&e.side===1);const live=S.ehq.find(e=>e.hp>0)||S.ehq[0];if(live){S.hq[1]=live;HQP[1]={x:live.x,y:live.y};
    if(MODE==='nation'){const ys=S.ehq.map(e=>e.y);EZ=Math.min(PZ-900,Math.max(...ys)+630);EZ0=Math.max(0,Math.min(...ys)-560);}}
  for(const[,[e,o]]of byId)if(o.lord&&byId.has(o.lord))e.lord=byId.get(o.lord)[0];
  sn.trenches.forEach(t=>{tryTrench(t[0],t[1],t[2],true);const T=S.trenches[S.trenches.length-1];if(T)T.hp=t[3];});
  NID=Math.max(NID,sn.nid||0);SQID=Math.max(SQID,sn.sqid||0);
  S.ePlan=(S.ePlan||[]).filter(p=>!S.ents.some(e=>e.side===1&&e.k.build&&Math.hypot(e.x-p.x,e.y-p.y)<20));
  rebuildHQFields();
  for(const e of S.ents)if(e.st==='move')e.fld=e.k.ship?fieldToW(e.gx??e.ax,e.gy??e.ay):fieldTo(e.gx??e.ax,e.gy??e.ay);
  computeFog();renderFortChips();updateButtons();
}

/* ---------- picture scroll of a pacified region: the whole map, and a close-up of your castle ---------- */
function regionSnapshot(){
  const c=document.createElement('canvas');c.width=480;c.height=400;const g=c.getContext('2d');
  g.fillStyle='#e9dbb5';g.fillRect(0,0,480,400);
  const mine=S.ents.filter(e=>e.side===0&&e.k.build&&!e.k.pit&&e.hp>0);
  // left strip: the whole province map
  const lw=150,lh=400,ls=Math.min(lw/W,lh/H);g.drawImage(OV,0,0,OV.width,OV.height,(lw-W*ls)/2,(lh-H*ls)/2,W*ls,H*ls);
  for(const e of mine){g.fillStyle=e.kind==='hq'?'#fff':'#e6b640';g.fillRect((lw-W*ls)/2+e.x*ls-1.5,(lh-H*ls)/2+e.y*ls-1.5,3,3);}
  // right: close-up of your fortifications
  let x0=HQP[0].x-120,x1=HQP[0].x+120,y0=HQP[0].y-200,y1=HQP[0].y+40;
  for(const e of mine){x0=Math.min(x0,e.x-70);x1=Math.max(x1,e.x+70);y0=Math.min(y0,e.y-90);y1=Math.max(y1,e.y+40);}
  const rw=330,rh=400,sc=Math.min(1.3,rw/(x1-x0),rh/(y1-y0));
  {const cx=(x0+x1)/2,cy=(y0+y1)/2,hw=rw/sc/2,hh=rh/sc/2;x0=clamp(cx-hw,0,Math.max(0,W-2*hw));x1=x0+2*hw;y0=clamp(cy-hh,0,Math.max(0,H-2*hh));y1=y0+2*hh;}
  const ox=150-x0*sc,oy=-y0*sc;
  g.save();g.beginPath();g.rect(150,0,rw,rh);g.clip();
  g.drawImage(OV,x0*OVRS,y0*OVRS,(x1-x0)*OVRS,(y1-y0)*OVRS,ox+x0*sc,oy+y0*sc,(x1-x0)*sc,(y1-y0)*sc);
  g.fillStyle='rgba(60,70,60,.55)';for(const t of S.trenches){g.beginPath();g.arc(ox+t.x*sc,oy+t.y*sc,5*sc,0,Math.PI*2);g.fill();}
  const ws=mine.filter(e=>e.k.hw);for(const e of ws){g.fillStyle=e.kind==='fence'?'#7a5534':'#e7dcc2';g.fillRect(ox+(e.x-18)*sc,oy+(e.y-5)*sc,36*sc,8*sc);
    g.fillStyle=e.kind==='fence'?'#4a3019':'#34333a';g.fillRect(ox+(e.x-18)*sc,oy+(e.y-7)*sc,36*sc,2.4*sc);if(e.kind==='wall2'){g.fillStyle='#f6f2e8';g.fillRect(ox+(e.x-16)*sc,oy+(e.y-14)*sc,32*sc,6*sc);g.fillStyle='#34333a';g.fillRect(ox+(e.x-17)*sc,oy+(e.y-17)*sc,34*sc,3*sc);}}
  for(const e of mine.filter(e=>!e.k.hw).sort((a,b)=>a.y-b.y)){const im=BSPR[e.kind]&&BSPR[e.kind][0];if(!im)continue;const b=BBOX[e.kind];
    g.drawImage(im,ox+(e.x+b[0])*sc,oy+(e.y+b[1])*sc,(b[2]-b[0])*sc,(b[3]-b[1])*sc);}
  g.restore();
  // frame and title
  g.strokeStyle='#8a6a1c';g.lineWidth=6;g.strokeRect(3,3,474,394);g.strokeStyle='#e6c46a';g.lineWidth=2;g.strokeRect(3,3,474,394);
  g.fillStyle='rgba(20,16,10,.7)';g.fillRect(160,12,150,34);g.fillStyle='#f4e6c0';g.font='800 22px "Shippori Mincho B1",serif';g.fillText(rn(S.prov.region)+(S.stage>=5?TT(' 平定',' - pacified'):TT(' 進軍中',' - campaign')),172,37);
  return c.toDataURL('image/jpeg',.82);
}

/* ---------- soldiers: pre-rendered sprites, three views (side / front / back) ---------- */
// SPR[kind][side][dir][frame]  dir: 0 side facing right, 1 side facing left, 2 front, 3 back
// frame: 0 idle, 1-6 walk / gallop, 7 wind-up, 8 strike, 9 brace (spear wall)
const SS=4.5,SX0=12,SY0=30,SWD=24,SHT=34;
const POSES=[0,2,5,7,8,9];// atlas columns -> pose: idle, step A, step B, wind-up, strike, spear wall
const PAL=[
  {arm:'#2a292d',armL:'#56545c',lace:'#b8913c',lace2:'#e2c77a',cloth:'#3a342d',flag:'#d9a93a',flagD:'#6e5418',mon:0},
  {arm:'#2b4a8c',armL:'#6d8fcf',lace:'#dfe5ef',lace2:'#ffffff',cloth:'#2f3a52',flag:'#3f73e6',flagD:'#1f3f8f',mon:1}
];
// your banner colour, chosen before battle; only the chosen colour's sprites are ever built
const FLAGS=[
  {id:'gold',n:'金',ne:'Gold',c:'#d9a93a',d:'#6e5418',mon:'#1a1a1e',am:'#1a1a1e',ui:'#d9a93a',txt:'#1a1408'},
  {id:'silver',n:'銀',ne:'Silver',c:'#c3c7cc',d:'#5f656c',mon:'#1a1a1e',am:'#1a1a1e',ui:'#c9ced4',txt:'#1a1408'},
  {id:'red',n:'赤',ne:'Red',c:'#c8321f',d:'#6e1a10',mon:'#f6f1e4',am:'#d8b04a',ui:'#e0503a',txt:'#fff'},
  {id:'white',n:'白',ne:'White',c:'#f1ece0',d:'#8d877a',mon:'#1a1a1e',am:'#b31d12',ui:'#f1ece0',txt:'#1a1408'},
  {id:'black',n:'黒',ne:'Black',c:'#1d1c21',d:'#0b0b0d',mon:'#f6f1e4',am:'#d8b04a',ui:'#55545e',txt:'#fff'},
  {id:'purple',n:'紫',ne:'Purple',c:'#6b3a92',d:'#33184a',mon:'#f6f1e4',am:'#d8b04a',ui:'#9a62c6',txt:'#fff'}];
function flagC(){let id='gold';try{id=SAVE.flag||'gold';}catch(e){}return FLAGS.find(f=>f.id===id)||FLAGS[0];}
let VETC='#ecd08e';
function applyFlag(){const f=flagC();PAL[0].flag=f.c;PAL[0].flagD=f.d;COL[0]=f.ui;VETC=shade(f.ui.length===7?f.ui:'#d9a93a',.42);}
// hidden regions field foreign armies: Gaya iron lamellar with plumed helmets and barded horses; Ainu bark-cloth robes, no armour, no horses
const PAL_BASE1={...PAL[1]};
const EPALS={gaya:{arm:'#4b5057',armL:'#a3abb4',lace:'#b22a20',lace2:'#d9cfb8',cloth:'#6e2620',flag:'#b8322a',flagD:'#5e1712',mon:1,style:'gaya'},
  ainu:{arm:'#b49a6a',armL:'#d8c79c',lace:'#23345a',lace2:'#b8322a',cloth:'#2a3550',flag:'#2a3550',flagD:'#121a30',mon:1,style:'ainu'}};
let STY='';
function setEnemyStyle(st){const want=st||'';if((PAL[1].style||'')===want)return false;Object.keys(PAL[1]).forEach(k=>delete PAL[1][k]);Object.assign(PAL[1],want?EPALS[want]:PAL_BASE1);return true;}
const SPR={},FALL={};
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(f>0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}else{r*=1+f;g*=1+f;b*=1+f;}
  return`rgb(${r|0},${g|0},${b|0})`;}
function poly(g,p,fill,stroke,w){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=w||.2;g.stroke();}}
function ln(g,x1,y1,x2,y2,col,w){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=w;g.stroke();}
function circ(g,x,y,r,fill){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=fill;g.fill();}
function lg(g,x0,y0,x1,y1,stops){const q=g.createLinearGradient(x0,y0,x1,y1);stops.forEach((c,i)=>q.addColorStop(i/(stops.length-1),c));return q;}
const INK='rgba(10,8,6,.85)',SKIN='#d3a57f',SKIND='#a97a58',IRON='#2b2927',STEEL='#e9edf0',WOODC='#6a4c30',GOLD='#d8b04a';
const SAMK={sword:1,cav:1,hcav:1,aka:1,gen:1},HELMK={sword:1,aka:1,gen:1};

function buildSprites(only){
  buildBuildingSprites(only);
  for(const kind of UNITK){
    if(!SPR[kind]){SPR[kind]=[[],[]];FALL[kind]=[[],[]];}
    for(let side=0;side<2;side++){
      if(only!=null&&side!==only)continue;
      STY=PAL[side].style||'';
      // one small atlas per kind and side: 3 facings (right, left, and back for us / front for the enemy)
      // x 6 poses (idle, two walking steps, wind-up, strike, spear wall), plus a half-size copy for normal zoom
      const CW=Math.round(SWD*SS),CH=Math.round(SHT*SS),A=document.createElement('canvas');A.width=CW*POSES.length;A.height=CH*3;
      const g=A.getContext('2d');g.lineCap='round';g.lineJoin='round';
      for(let dir=0;dir<3;dir++)POSES.forEach((fr,col)=>{
        if(fr===9&&kind!=='spear'){g.drawImage(A,0,dir*CH,CW,CH,col*CW,dir*CH,CW,CH);return;}
        g.save();g.translate(col*CW+SX0*SS,dir*CH+SY0*SS);g.scale(SS*(dir===1?-1:1),SS);
        const view=dir<2?'S':side===0?'B':'F';
        if(K[kind].horse)drawRider(g,kind,PAL[side],fr,view);else drawMan(g,kind,PAL[side],fr,view,false,false);
        g.restore();});
      const Hc=document.createElement('canvas');Hc.width=A.width/2|0;Hc.height=A.height/2|0;
      const hg=Hc.getContext('2d');hg.imageSmoothingEnabled=true;hg.imageSmoothingQuality='high';hg.drawImage(A,0,0,Hc.width,Hc.height);
      SPR[kind][side]={A,H:Hc,cw:CW,ch:CH};
      if(side===0){// veterans: the same soldiers a little paler
        const pale=src=>{const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const q=c.getContext('2d');q.drawImage(src,0,0);q.globalCompositeOperation='source-atop';q.fillStyle='rgba(250,244,228,.26)';q.fillRect(0,0,c.width,c.height);return c;};
        SPR[kind][2]={A:pale(A),H:pale(Hc),cw:CW,ch:CH};}
      for(const fi of[0,1]){
        const c=document.createElement('canvas');c.width=Math.round(SWD*SS);c.height=Math.round(SHT*SS);
        const g=c.getContext('2d');g.lineCap='round';g.lineJoin='round';
        g.translate(SX0*SS,SY0*SS);g.scale(SS*(fi?-1:1),SS);
        g.fillStyle='rgba(60,25,15,.35)';g.beginPath();g.ellipse(-4.5,-.8,7,1.8,0,0,Math.PI*2);g.fill();
        g.save();g.translate(1.5,-1);g.rotate(-Math.PI/2+.12);drawMan(g,K[kind].horse?(kind==='gen'||kind==='aka'?kind:'sword'):kind,PAL[side],0,'S',false,true);g.restore();
        g.globalCompositeOperation='source-atop';g.fillStyle='rgba(30,22,16,.35)';g.fillRect(-SX0,-SY0,SWD,SHT);
        g.globalCompositeOperation='source-over';
        if(kind==='aka')poly(g,[[5,-1.6],[8.8,-2.2],[8.6,-.6],[5,-.3]],'#b31d12');
        FALL[kind][side][fi]=c;
      }
    }
  }

}

/* ---------- colours for one soldier ---------- */
function kit(kind,p){
  const k={kind,sam:!!SAMK[kind],helm:!!HELMK[kind],arm:p.arm,armL:p.armL,lace:p.lace,lace2:p.lace2,cloth:p.cloth,p};
  if(p.style==='ainu'){k.sam=false;k.helm=false;}

  if(kind==='gen')Object.assign(k,{arm:'#1c1a1f',armL:'#5c5866',lace:'#e0b446',lace2:'#fff0b8'});

/* ---------- pose: leg phase, body bob, hand targets and weapon line ---------- */
function walkPh(fr){return fr>=1&&fr<=6?(fr-1)/6*Math.PI*2:null;}

// draw one man standing (mounted=false) or seated (mounted=true), feet/hip anchored at origin
function drawMan(g,kind,p,fr,view,mounted,noFlag){
  const K2=kit(kind,p),ph=walkPh(fr),brace=fr===9;
  const bob=mounted?0:ph!=null?.28*Math.abs(Math.sin(ph)):brace?.9:0;
  g.save();g.translate(0,bob);
  if(view==='S')manSide(g,K2,fr,ph,mounted,noFlag,brace);
  else manFront(g,K2,fr,ph,mounted,noFlag,view==='B',brace);
  g.restore();
}

/* ======================= SIDE VIEW (facing +x) ======================= */
function manSide(g,K2,fr,ph,mounted,noFlag,brace){
  const kind=K2.kind,sam=K2.sam;
  const lean=ph!=null?.07:brace?.16:fr===8?.12:0;
  // flags behind the back
  if(!noFlag)backFlagSide(g,K2,fr);
  // legs
  if(mounted){
    legSeatSide(g,K2,false);
  }else{
    const a=ph!=null?ph:0,sw=ph!=null?1.9:0;
    let f1=Math.sin(a)*sw,f2=-Math.sin(a)*sw,l1=ph!=null?Math.max(0,Math.cos(a))*.7:0,l2=ph!=null?Math.max(0,-Math.cos(a))*.7:0;
    if(brace){f1=2.2;f2=-2.4;}
    if(fr===8&&!ph){f1=2.4;f2=-2;}
    if(fr===7&&!ph){f1=.9;f2=-1.3;}
    legSide(g,K2,-.35,f2,l2,false);legSide(g,K2,.35,f1,l1,true);
  }
  g.save();g.translate(0,-6.1);g.rotate(lean);g.translate(0,6.1);
  const W=weaponSide(kind,fr,ph);
  // far arm and far-side weapon parts
  if(W.far)armSide(g,K2,W.far,false);
  if(W.behind)W.behind(g,K2);
  torsoSide(g,K2,fr,ph);
  headSide(g,K2);
  if(W.draw)W.draw(g,K2);
  if(W.near)armSide(g,K2,W.near,true);

  g.restore();

      for(const t of[.18,.42,.78]){const bx=(1-t)*(1-t)*top[0]+2*(1-t)*t*(gx+2.3*S)+t*t*bot[0],by=(1-t)*(1-t)*top[1]+2*(1-t)*t*(gy-2.5*S)+t*t*bot[1];ln(g,bx-.28,by,bx+.28,by,'#c9a46c',.26);}
      g.beginPath();g.moveTo(top[0],top[1]);g.lineTo(drawX,drawY);g.lineTo(bot[0],bot[1]);g.strokeStyle='rgba(240,236,222,.85)';g.lineWidth=.1;g.stroke();};
    if(a5){W.far=[3.7,-9.3];W.near=[-.5,-10.3];const b=bow(3.7,-9.3,-.5,-10.3);W.draw=g=>{b(g);ln(g,-.5,-10.3,5.6,-9.6,'#b89a6a',.2);yariTip(g,-.5,-10.3,5.6,-9.6,.7);ln(g,-.4,-10.3,.4,-10.2,'#e8e2d0',.4);};}

      for(let i=0;i<4;i++)ln(g,-1.9+i*.28,-9.3,-2.2+i*.28,-10.8,'#efe9da',.24);};
  }else if(kind==='eng'){

      g.save();g.translate(x2,y2);g.rotate(Math.atan2(uy,ux));poly(g,[[-.3,-1.2],[1.3,-1.2],[1.3,1.2],[-.3,1.2]],lg(g,0,-1.2,0,1.2,['#8a6a45','#4a3420']),INK,.12);
      ln(g,-.1,-1.2,-.1,1.2,'#2a2a2a',.22);ln(g,1.1,-1.2,1.1,1.2,'#2a2a2a',.22);g.restore();};
    if(a5){W.near=[.3,-12.1];W.far=[.1,-11.6];W.draw=mallet(.4,-11.6,-2.2,-15.5);}
    else if(a6){W.near=[3.1,-6.9];W.far=[2.6,-7.3];W.draw=mallet(2.3,-7.6,6.4,-3.6);}

  }else if(kind==='cav'||kind==='aka'){

    else if(a6){W.near=[3.6,-7.8];W.draw=g=>{shaft(g,-2.2,-7.2,10.6,-9.3);yariTip(g,-2.2,-7.2,10.6,-9.3,1.9);};}
    else{W.near=[2.2,-7.2];W.draw=g=>{shaft(g,-2.4,-3.2,6.9,-16.4);yariTip(g,-2.4,-3.2,6.9,-16.4,1.8);

    const FC=K2.p&&K2.p.mon===0?flagC():null;g.fillStyle=lg(g,-1.3,0,-5.6,0,FC?[shade(FC.c,.12),FC.d]:['#e43324','#8a120b']);g.fill();g.strokeStyle='rgba(20,6,4,.6)';g.lineWidth=.12;g.stroke();

/* ======================= FRONT / BACK VIEW ======================= */
function manFront(g,K2,fr,ph,mounted,noFlag,back,brace){
  const kind=K2.kind,sam=K2.sam;
  const flip=back?-1:1;// figure's right hand is on the viewer's left from the front, on the right from the back
  if(!noFlag&&!back)backFlagFront(g,K2,fr,false);
  const W=weaponFront(kind,fr,ph,flip,brace);
  if(back&&W.draw)W.draw(g,K2);
  // legs
  if(mounted){
    const col=sam?shade(K2.arm,-.2):shade(K2.cloth,-.1);
    for(const s of[-1,1]){ln(g,s*.6,-6.1,s*2.1,-5.2,col,1.5);ln(g,s*2.1,-5.2,s*2.0,-2.7,'#2e2b28',1.0);g.fillStyle='#8a6d45';g.beginPath();g.ellipse(s*2.05,-2.55,.45,.35,0,0,Math.PI*2);g.fill();}
  }else{
    const a=ph!=null?ph:0,st=brace?1.45:1;
    for(const s of[-1,1]){
      const lift=ph!=null?Math.max(0,Math.sin(a)*s)*.75:0,fwd=ph!=null?Math.sin(a)*s*(back?-1:1):0;
      const hx=s*.65,fx=s*(.95*st),fy=-.3-lift+fwd*.25,kx=s*(.85*st),ky=-3.2-lift*.5;
      const d=fwd<0?-.2:0;
      ln(g,hx,-6.1,kx,ky,sam?shade(K2.arm,d-.1):shade(K2.cloth,d),sam?1.5:1.8);
      ln(g,kx,ky,fx,fy,sam?shade('#2e2b28',d):shade('#cfc5ae',d-.05),sam?1.1:1.0);
      if(!sam)ln(g,kx,ky+.6,fx,fy-.3,shade('#4a4038',d),.5);
      g.fillStyle=shade('#8a6d45',d);g.beginPath();g.ellipse(fx,fy+.1,.55,.38,0,0,Math.PI*2);g.fill();
    }
  }
  // kusazuri: plates round the hips
  const a=K2.arm,n=sam?5:3,wid=sam?4.0:3.4;
  for(let i=0;i<n;i++){const x0=-wid/2+i*wid/n,x1=x0+wid/n-.08,y0=-6.7,y1=sam?-4.1:-4.6,fl=(i-(n-1)/2)*.18;
    poly(g,[[x0,y0],[x1,y0],[x1+fl+.12,y1],[x0+fl-.12,y1]],lg(g,x0,y0,x1,y1,[shade(a,.15),shade(a,-.35)]),INK,.1);
    if(sam)for(let r=1;r<=4;r++){const y=y0+(y1-y0)*r/5;ln(g,x0+.05+fl*r/5,y,x1-.05+fl*r/5,y,K2.lace,.12);}}
  // cuirass
  const body=[[-1.55,-6.6],[1.55,-6.6],[1.85,-8.2],[1.7,-10.0],[-1.7,-10.0],[-1.85,-8.2]];
  poly(g,body,lg(g,-1.8,-10,1.8,-6.6,[shade(a,.3),a,shade(a,-.45)]),INK,.16);
  if(sam){for(let i=1;i<=6;i++){const y=-6.6-i*.5;ln(g,-1.8+(i>4?.1:0),y,1.8-(i>4?.1:0),y,i%2?K2.lace:K2.lace2,.12);}
    if(!back){ln(g,-.5,-9.9,-.4,-6.8,'rgba(0,0,0,.25)',.08);ln(g,.5,-9.9,.4,-6.8,'rgba(0,0,0,.25)',.08);}}
  else if(STY==='ainu'){ainuPattern(g,-1.8,1.8,-9.7,-6.8);}
  else{for(const y of[-7.4,-8.2,-9.0])ln(g,-1.8,y,1.8,y,'rgba(0,0,0,.4)',.12);
    if(!back)mon(g,0,-8.4,.72,K2.p);}
  ln(g,-1.3,-9.8,-1.55,-7.2,'rgba(255,255,255,.25)',.24);
  // arms and sode
  const arm=(sx,hx,hy,near)=>{const ex=(sx+hx)/2+(sx<0?-.35:.35),ey=(-9.7+hy)/2+.4,col=sam?'#221f25':shade(K2.cloth,-.1);
    ln(g,sx,-9.7,ex,ey,col,1.0);ln(g,ex,ey,hx,hy,col,.85);circ(g,hx,hy,.38,back?SKIND:SKIN);};
  if(W.hands){arm(-1.55,W.hands[0][0],W.hands[0][1]);arm(1.55,W.hands[1][0],W.hands[1][1]);}
  for(const s of[-1,1]){const x0=s*1.45,x1=s*2.65;
    if(sam){poly(g,[[x0,-10.1],[x1,-9.9],[x1+s*.15,-7.7],[x0+s*.1,-7.8]],lg(g,x0,-10,x1,-7.8,[shade(a,.2),shade(a,-.35)]),INK,.1);
      for(let r=1;r<=4;r++){const y=-10.05+r*.45;ln(g,x0,y,x1+s*.1,y+.05,r%2?K2.lace:K2.lace2,.1);}}
    else poly(g,[[x0,-10.0],[x1-s*.3,-9.9],[x1-s*.2,-9.0],[x0,-9.0]],shade(a,-.1),INK,.08);}
  // head
  ln(g,0,-10,0,-10.6,SKIND,.8);
  headFront(g,K2,back);
  if(!back&&W.draw)W.draw(g,K2);
  if(!noFlag&&back)backFlagFront(g,K2,fr,true);
}
function ainuPattern(g,x0,x1,y0,y1){// indigo hems and bands with red stitching, like an attush robe
  ln(g,x0,y1-.15,x1,y1-.15,'#23345a',.45);ln(g,x0+.3,y0+.2,x0+.3,y1,'#23345a',.35);ln(g,x1-.3,y0+.2,x1-.3,y1,'#23345a',.35);
  g.beginPath();for(let x=x0+.2;x<x1-.2;x+=.5){g.moveTo(x,y1-.45);g.lineTo(x+.25,y1-.75);g.lineTo(x+.5,y1-.45);}g.strokeStyle='#b8322a';g.lineWidth=.08;g.stroke();
  g.beginPath();g.arc((x0+x1)/2,(y0+y1)/2-.2,.55,0,Math.PI*1.6);g.strokeStyle='#23345a';g.lineWidth=.16;g.stroke();
}
function headFront(g,K2,back){
  const kind=K2.kind;
  g.beginPath();g.ellipse(0,-11.5,.88,.98,0,0,Math.PI*2);g.fillStyle=back?'#1b1714':lg(g,-.8,-12,.8,-11,[SKIN,SKIND]);g.fill();
  if(!back){circ(g,-.33,-11.62,.1,'#1a1410');circ(g,.33,-11.62,.1,'#1a1410');}
  if(foreignHead(g,K2,0,true,back))return;
  if(K2.helm){
    const H=kind==='aka'?['#e0584a','#b22019','#5c0c07']:kind==='gen'?['#6a6270','#1d1b20','#050506']:['#5f5a55','#2b2826','#0d0c0b'];
    // shikoro flaring down both sides
    for(let i=0;i<3;i++){const y=-11.7+i*.45,w=1.25+i*.33;poly(g,[[-w,y+.5],[-w+.2,y],[w-.2,y],[w,y+.5]],i===2?shade(K2.arm,-.1):H[1],INK,.08);ln(g,-w+.1,y+.32,w-.1,y+.32,K2.lace,.09);}
    if(back){g.beginPath();g.ellipse(0,-11.3,1.2,.9,0,0,Math.PI*2);g.fillStyle=H[1];g.fill();}
    else{poly(g,[[-.62,-11.3],[.62,-11.3],[.55,-10.5],[0,-10.25],[-.55,-10.5]],lg(g,0,-11.3,0,-10.3,['#6a2a20','#3a120c']),INK,.08);ln(g,-.45,-10.95,.45,-10.95,'rgba(230,220,210,.6)',.08);}
    g.beginPath();g.arc(0,-11.72,1.22,Math.PI,0);g.closePath();g.fillStyle=lg(g,-1,-13,1,-11.6,H);g.fill();
    for(let i=-3;i<=3;i++)ln(g,i*.33,-11.75,i*.2,-12.85,'rgba(255,255,255,.15)',.06);
    ln(g,-1.25,-11.72,1.25,-11.72,H[2],.3);
    for(const s of[-1,1])poly(g,[[s*1.15,-11.8],[s*1.75,-11.95],[s*1.65,-11.2],[s*1.15,-11.25]],H[1],INK,.07);// fukigaeshi
    // crest
    if(kind==='aka'){g.beginPath();g.moveTo(-.3,-12.6);g.bezierCurveTo(-1.8,-13.6,-2.8,-15.6,-2.3,-18.6);g.moveTo(.3,-12.6);g.bezierCurveTo(1.8,-13.6,2.8,-15.6,2.3,-18.6);
      g.strokeStyle='#5a4210';g.lineWidth=.8;g.stroke();g.strokeStyle=GOLD;g.lineWidth=.52;g.stroke();circ(g,0,-12.9,.62,GOLD);circ(g,0,-12.9,.33,'#fff1b8');}
    else if(kind==='gen'){circ(g,0,-14,1.8,'#5a4210');circ(g,0,-14,1.62,GOLD);circ(g,0,-14,1.05,'#fff1b8');circ(g,0,-14,.7,GOLD);}
    else{g.beginPath();g.moveTo(-.2,-12.7);g.quadraticCurveTo(-1,-14,-1.5,-14.6);g.moveTo(.2,-12.7);g.quadraticCurveTo(1,-14,1.5,-14.6);g.strokeStyle=GOLD;g.lineWidth=.3;g.stroke();}
  }else if(K2.sam){
    g.beginPath();g.arc(0,-11.8,.93,Math.PI,0);g.closePath();g.fillStyle='#15120f';g.fill();
    poly(g,[[-.25,-12.6],[0,-13.2],[.25,-12.6]],'#15120f');
    ln(g,-.95,-11.95,.95,-11.95,'#f0ebe0',.32);
    if(back){ln(g,0,-11.95,-.4,-10.9,'#f0ebe0',.22);ln(g,0,-11.95,.4,-10.9,'#f0ebe0',.22);}
  }else{
    g.beginPath();g.moveTo(-2.2,-11.35);g.quadraticCurveTo(0,-13.3,2.2,-11.35);g.quadraticCurveTo(0,-10.95,-2.2,-11.35);
    g.fillStyle=lg(g,-2,-13,2,-11,[shade(K2.arm,.3),K2.arm,shade(K2.arm,-.45)]);g.fill();g.strokeStyle=INK;g.lineWidth=.1;g.stroke();
    if(!back)mon(g,0,-12.05,.42,K2.p);
  }
}
function backFlagFront(g,K2,fr,back){
  if(K2.kind==='gen'){const cy=back?-11.6:-12.6,wv=fr%2?.15:0;
    g.beginPath();g.ellipse(0,cy,3.2+wv,3.4,0,0,Math.PI*2);g.fillStyle=lg(g,-3,cy-3,3,cy+3,['#f7d773','#d9a531','#8f6414']);g.fill();g.strokeStyle='rgba(60,40,6,.7)';g.lineWidth=.14;g.stroke();
    for(const o of[-1.4,0,1.4]){g.beginPath();g.moveTo(o,cy-3.3);g.quadraticCurveTo(o*1.4,cy,o,cy+3.3);g.strokeStyle='rgba(110,75,10,.4)';g.lineWidth=.1;g.stroke();}
    if(back)drawMon(g,myMon(),0,cy,1.6,'#1a1a1e',null,'#e3b545');}
  else if(K2.kind==='aka'){const top=-20.2,wv=fr%2?.2:0,x0=back?.2:-2.2,x1=x0+2.6;
    ln(g,back?.2:-.2,-7,back?.2:-.2,top-.2,'#2b2118',.3);
    g.beginPath();g.moveTo(x0,top);g.lineTo(x1,top+wv);g.lineTo(x1,top+7.2);g.lineTo(x0,top+7.2-wv);g.closePath();{const FC=K2.p&&K2.p.mon===0?flagC():null;g.fillStyle=lg(g,x0,0,x1,0,FC?[shade(FC.c,.12),FC.d]:['#e43324','#8a120b']);g.fill();
    ln(g,x0,top,x1,top,GOLD,.3);if(back)drawMon(g,myMon(),(x0+x1)/2,top+3.6,1.1,FC?FC.am:GOLD,null,FC?FC.c:'#b31d12');}}
}
function weaponFront(kind,fr,ph,flip,brace){
  // hands: [figure's right, figure's left] in viewer x; flip mirrors for the back view
  const W={},a5=fr===7,a6=fr===8,sw=ph!=null?Math.sin(ph)*.3:0;
  const R=(x,y)=>[x*flip,y];
  if(kind==='sword'||(kind==='gen'&&(a5||a6))){
    if(a5){W.hands=[R(-.4,-13.3),R(.4,-13.3)];W.draw=g=>{tsuka(g,0,-13.3,0,-14.4);blade(g,0,-14.5,-3.4*flip,-15.4,-1.6*flip,-15.4);};}
    else if(a6){W.hands=[R(.2,-7.0),R(.9,-6.9)];W.draw=g=>{tsuka(g,.3*flip,-7.0,1.1*flip,-6.6);blade(g,1.2*flip,-6.5,4.6*flip,-2.8,3.3*flip,-5.2);};}
    else{W.hands=[R(-.3,-7.6),R(.3,-7.6)];W.draw=g=>{tsuka(g,0,-7.2,0,-8.4);blade(g,0,-8.5,.5*flip,-13.9,.4*flip,-11.2);};}
  }else if(kind==='gen'){W.hands=[R(-2.3,-11.0),R(1.6,-7.4+sw)];W.draw=g=>{const x=-2.5*flip;ln(g,-2.3*flip,-11,x,-12.3,'#1d1510',.3);g.beginPath();g.ellipse(x,-13.3,1.0,1.2,0,0,Math.PI*2);g.fillStyle='#16110e';g.fill();circ(g,x,-13.3,.45,'#c9261a');};}
  else if(kind==='spear'){
    if(a5){W.hands=[R(-2.0,-8.2),R(-.6,-7.4)];W.draw=g=>{shaft(g,-3.8*flip,-11.8,1.4*flip,-3.2);yariTip(g,1.4*flip,-3.2,-3.8*flip,-11.8,1.9);};}
    else if(a6||brace){W.hands=[R(-1.2,-7.0),R(.6,-6.4)];W.draw=g=>{shaft(g,-2.4*flip,-8.2,1.8*flip,-4.0);yariTip(g,-2.4*flip,-8.2,1.8*flip,-4.0,1.6);
      if(brace)ln(g,-2.4*flip,-8.2,-4.2*flip,-10.0,WOODC,.38);};}
    else{W.hands=[R(-2.2,-7.8),R(1.5,-7.2+sw)];W.draw=g=>{shaft(g,-2.4*flip,.4,-2.7*flip,-19.2);yariTip(g,-2.4*flip,.4,-2.7*flip,-19.2,2.0);};}
  }else if(kind==='archer'||kind==='hcav'){
    const S=kind==='hcav'?.8:1,bx=2.2*flip;
    const bow=(dx,dy)=>g=>{const top=[bx+.4*flip,-8-9*S],bot=[bx-.1*flip,-8+4.4*S];
      g.beginPath();g.moveTo(top[0],top[1]);g.quadraticCurveTo(bx+1.2*flip,-8,bot[0],bot[1]);g.strokeStyle=INK;g.lineWidth=.6;g.stroke();g.strokeStyle='#2a1a0f';g.lineWidth=.38;g.stroke();
      g.beginPath();g.moveTo(top[0],top[1]);g.lineTo(dx,dy);g.lineTo(bot[0],bot[1]);g.strokeStyle='rgba(240,236,222,.85)';g.lineWidth=.1;g.stroke();};
    if(a5){W.hands=[R(-.9,-10.6),R(2.2,-8.6)];W.draw=bow(-.9*flip,-10.6);}
    else if(a6){W.hands=[R(-2.0,-11.2),R(2.2,-8.6)];W.draw=bow(bx-.3*flip,-8.2);}
    else{W.hands=[R(-1.6,-7.2+sw),R(2.2,-8.0)];W.draw=bow(bx-.3*flip,-8);}
  }else if(kind==='eng'){
    const mal=(x1,y1,x2,y2)=>g=>{shaft(g,x1,y1,x2,y2);g.save();g.translate(x2,y2);g.rotate(Math.atan2(y2-y1,x2-x1));poly(g,[[-.3,-1.1],[1.2,-1.1],[1.2,1.1],[-.3,1.1]],lg(g,0,-1.1,0,1.1,['#8a6a45','#4a3420']),INK,.12);g.restore();};
    if(a5){W.hands=[R(-.3,-12.6),R(.3,-12.6)];W.draw=mal(0,-12,0,-15.8);}
    else if(a6){W.hands=[R(.3,-6.6),R(.9,-6.4)];W.draw=mal(.5*flip,-6.9,2.6*flip,-2.6);}
    else{W.hands=[R(-1.8,-9.6),R(1.5,-7.2+sw)];W.draw=mal(-1.2*flip,-8.2,-2.6*flip,-13.2);}

/* ---------- save data backup: move your progress to another address or phone ---------- */
function saveKeys(){const ks=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('yaji-'))ks.push(k);}}catch(e){}return ks;}
function showSaveIO(){
  openOv('saveio',`<div class="card"><h2>${TT('セーブデータ','Save data')}</h2>
    <p>${TT('進み具合・家名と官位・城・絵巻はこの端末のこのアドレスに保存されています。同じアドレスのままアップデートすれば消えません。別のアドレスや別のスマホへ移すときは、ファイルに書き出して、移した先で読み込みます。','Your progress, name, rank, castles and scrolls are stored on this device for this web address. Updates at the same address keep them. To move to another address or phone, back them up to a file and restore it there.')}</p>
    <button class="big" id="sOut">${TT('ファイルに書き出す','Back up to a file')}</button>
    <button class="cb" id="sIn">${TT('ファイルから読み込む','Restore from a file')}</button>
    <input type="file" id="sFile" accept=".json,application/json" hidden>
    <p id="sMsg"></p>
    <button class="cb" id="sBack">${TT('戻る','Back')}</button></div>`);
  $('#sOut').onclick=()=>{SFX.click();const data={};for(const k of saveKeys())data[k]=localStorage.getItem(k);
    const blob=new Blob([JSON.stringify({app:'buke-kassen',v:1,date:new Date().toISOString(),data})],{type:'application/json'});
    const a=document.createElement('a'),d=new Date(),p=n=>String(n).padStart(2,'0');a.href=URL.createObjectURL(blob);a.download=`buke-kassen-save-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    $('#sMsg').textContent=TT('書き出しました（ダウンロードフォルダ）','Saved to your downloads');};
  $('#sIn').onclick=()=>{SFX.click();$('#sFile').click();};
  $('#sFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
    try{const o=JSON.parse(await f.text());if(o.app!=='buke-kassen'||!o.data||!o.data['yaji-v3-save'])throw new Error('bad');
      if(!confirm(TT('今の進み具合を、このファイルの内容で置きかえます。よろしいですか？','Replace your current progress with this file?')))return;
      for(const k of saveKeys())localStorage.removeItem(k);
      for(const k in o.data)if(k.startsWith('yaji-'))localStorage.setItem(k,o.data[k]);
      location.reload();
    }catch(e){$('#sMsg').textContent=TT('読み込めませんでした（武家合戦のセーブファイルではないか、容量が足りません）','Could not restore (not a Buke Kassen save file, or not enough storage)');}};
  $('#sBack').onclick=()=>{SFX.click();showTitle();};
}

function finaleArmies(){
  if(SAVE.finale&&SAVE.finale.armies&&!(S&&S.level===FINALE_LEVEL&&S.replay==null&&S.over))return SAVE.finale.armies;
  const nat=SAVE.nat||{},add=(m,a,k)=>{let g=m.get(a);if(!g){g={name:a,n:0,kinds:{}};m.set(a,g);}g.n++;g.kinds[k]=(g.kinds[k]||0)+1;};
  const field=new Map(),carry=new Map();
  if(S)for(const e of S.ents)if(e.side===0&&e.hp>0&&!e.k.build&&!e.k.ship){add(field,e.vet&&e.army?e.army:'本隊',e.kind);if(e.cargo)for(const c of e.cargo)add(field,c.army||'本隊',c.kind);}
  for(const u of (nat.camp&&nat.camp.units)||[])add(carry,u.a||'本隊',u.k);
  const all=new Map(field);for(const[k,g]of carry){const f=all.get(k);if(!f||g.n>f.n)all.set(k,g);}
  const ord=n=>{if(n==='本隊')return 98;const i=REGIONS.findIndex(R=>n===R[0]+'軍');return i<0?50:i;};
  const res=[...all.values()].sort((a,b)=>ord(a.name)-ord(b.name)||b.n-a.n);
  SAVE.finale={armies:res,date:Date.now()};save();return res;}
